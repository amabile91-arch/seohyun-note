function ThemeInput({themes,setThemes,allThemes,ci,onSetIcon,usMode=false}) {
  const [inp,setInp] = useState("");
  const [sug,setSug] = useState(false);
  const [et,setEt] = useState(null);
  const [se,setSe] = useState(false);
  const filtered = allThemes.filter(t=>t.includes(inp)&&!themes.includes(t));
  const add = (t) => { if(!t.trim())return; if(!themes.includes(t))setThemes([...themes,t]); setInp(""); setSug(false); };
  const rem = (t) => setThemes(themes.filter(x=>x!==t));
  const ac=usMode?C.usMid:C.pink1, bg=usMode?C.usLight:C.pink3, bd=usMode?`1.5px solid ${C.usMid}`:`1.5px solid ${C.pink1}`, is=usMode?iUS:iBase;
  return (
    <>
      {themes.length>0 && <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>{themes.map(t=><span key={t} style={{display:"flex",alignItems:"center",gap:4,padding:"4px 10px",borderRadius:20,background:bg,border:bd,fontSize:12,fontWeight:700,color:ac}}><button onMouseDown={()=>{setEt(t);setSe(true);}} style={{background:"none",border:"none",cursor:"pointer",fontSize:14,padding:0}}>{getThemeIcon(t,ci)}</button>{t}<button onMouseDown={()=>rem(t)} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,color:ac,padding:0}}>✕</button></span>)}</div>}
      <div style={{position:"relative"}}>
        <input value={inp} onChange={e=>{setInp(e.target.value);setSug(true);}} onFocus={()=>setSug(true)} onBlur={()=>setTimeout(()=>{if(inp.trim())add(inp.trim());setSug(false);},200)} onKeyDown={e=>{if(e.key==="Enter"&&inp.trim())add(inp.trim());}} placeholder="테마 입력 후 Enter" style={is}/>
        {sug&&filtered.length>0&&<div style={{position:"absolute",zIndex:10,width:"100%",borderRadius:12,boxShadow:`0 4px 16px ${C.pink1}30`,marginTop:4,border:`1.5px solid ${C.border}`,background:C.card,overflow:"hidden"}}>{filtered.map(t=><div key={t} style={{padding:"10px 14px",fontSize:13,cursor:"pointer",color:C.text}} onMouseDown={()=>add(t)}>{getThemeIcon(t,ci)} {t}</div>)}</div>}
      </div>
      {se && <EmojiPicker current={ci[et]} onSelect={em=>{if(et)onSetIcon(et,em);setEt(null);}} onClose={()=>{setSe(false);setEt(null);}}/>}
    </>
  );
}

        <div style={{display:"flex",alignItems:"center",gap:8,flex:1,flexWrap:"wrap",minWidth:0}}>
          {isClosed&&<span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:"#e0e0e0",color:"#888",fontWeight:700}}>종료</span>}
          <span style={{fontWeight:800,fontSize:15,color:isClosed?"#aaa":C.usBlue}}>{hl(card.stock)}</span>
          <span style={{fontSize:12,fontWeight:700,padding:"2px 8px",borderRadius:8,background:isClosed?"#e8e8e8":C.usLight,color:isClosed?"#aaa":C.usMid}}>{card.ticker}</span>
          {card.marketCapUSD&&<span style={{fontSize:11,padding:"2px 7px",borderRadius:8,background:isClosed?"#eee":"#e8f0f8",color:isClosed?"#aaa":"#424242",fontWeight:600}}>{fmtUSD(card.marketCapUSD)}</span>}
          {getThemes(card).map(t=><span key={t} style={{fontSize:11,padding:"2px 7px",borderRadius:20,background:isClosed?"#eee":C.usLight,color:isClosed?"#aaa":C.usMid,fontWeight:600}}>{getThemeIcon(t,ci)} {t}</span>)}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
          <button onClick={e=>{e.stopPropagation();toggleFav(card.stock);}} style={{padding:5,background:"none",border:"none",cursor:"pointer",fontSize:15}}>{isFav?"⭐":"☆"}</button>
          <button onClick={e=>{e.stopPropagation();onEdit(card);}} style={{padding:3,background:"none",border:"none",cursor:"pointer",fontSize:13}}>✏️</button>
          <button onClick={e=>{e.stopPropagation();onDelete(card.id);}} style={{padding:3,background:"none",border:"none",cursor:"pointer",fontSize:13}}>🗑️</button>
          <span style={{fontSize:13,color:isClosed?"#aaa":C.usMid}}>{open?"▲":"▼"}</span>
        </div>
      </div>
      {open&&<div style={{padding:"12px 16px 16px",display:"flex",flexDirection:"column",gap:8,borderTop:`1px solid ${isClosed?"#e8e8e8":C.usLight}`,background:isClosed?"#f8f8f8":"#f5f8ff"}}>
        {(card.currentPrice||vsT||p52)&&<div style={{display:"flex",flexWrap:"wrap",gap:6,paddingTop:2}}>
          {card.currentPrice&&<span style={{fontSize:12,fontWeight:700,padding:"3px 10px",borderRadius:8,background:isClosed?"#eee":C.usLight,color:isClosed?"#aaa":C.usMid}}>${card.currentPrice}{fmtKRW(card.currentPrice)?" ("+fmtKRW(card.currentPrice)+")":""}</span>}
          {vsT!=null&&<span style={{fontSize:12,fontWeight:700,padding:"3px 10px",borderRadius:8,background:isClosed?"#eee":Number(vsT)>=0?C.mint2:C.red2,color:isClosed?"#aaa":Number(vsT)>=0?"#2a9d8f":"#c0392b"}}>목표 {Number(vsT)>=0?"+":""}{vsT}%</span>}
          {p52!=null&&<span style={{fontSize:12,fontWeight:700,padding:"3px 10px",borderRadius:8,background:isClosed?"#eee":C.yellow2,color:isClosed?"#aaa":"#b09020"}}>52주 {p52}%</span>}
        </div>}
        {card.earningsDate&&<span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:isClosed?"#eee":"#f3e8f8",color:isClosed?"#aaa":"#8060a0",fontWeight:600,display:"inline-block",width:"fit-content"}}>실적 {fmtDate(card.earningsDate)}</span>}
        <p style={{fontSize:12,color:isClosed?"#aaa":C.text,margin:0,padding:"8px 12px",background:isClosed?"#eee":C.usLight,borderRadius:10,borderLeft:`3px solid ${isClosed?"#ccc":C.usMid}`}}><span style={{fontWeight:700,color:isClosed?"#aaa":C.usMid}}>💡 </span>{hl(card.reason)}</p>
        {isClosed&&<p style={{fontSize:12,color:"#aaa",margin:0,padding:"6px 10px",background:"#eee",borderRadius:8,borderLeft:"3px solid #ccc"}}>🚪 {card.closedReason}</p>}
        {card.news&&card.news.length>0&&<div>
          <button onClick={e=>{e.stopPropagation();setNe(p=>!p);}} style={{background:"none",border:`1px solid ${C.usLight}`,borderRadius:10,padding:"6px 12px",fontSize:11,fontWeight:700,color:C.usMid,cursor:"pointer"}}>📰 뉴스 {card.news.length}건 {ne?"▲":"▼"}</button>
          {ne&&<div style={{display:"flex",flexDirection:"column",gap:6,marginTop:8}}>{[...card.news].sort((a,b)=>b.date.localeCompare(a.date)).map(n=><div key={n.id} style={{padding:"8px 10px",background:C.usLight,borderRadius:10}}><p style={{fontSize:11,color:C.usMid,fontWeight:700,margin:"0 0 2px"}}>{fmtDate(n.date)}</p><p style={{fontSize:12,color:C.text,margin:0}}>{n.content}</p></div>)}</div>}
        </div>}
      </div>}
    </div>
  );
}

// ── AI 분석 탭 ──
function AIAnalysisTab({ krRecords, usCards, ipoRecords, principle }) {
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const [activeMode, setActiveMode] = useState(null);

  const MODES = [
    { id: "pattern", icon: "🔍", label: "승률 패턴 분석", color: C.pink1, bg: C.pink3,
      desc: "어떤 조건일 때 D+1, D+2가 좋았는지 패턴 도출" },
    { id: "theme", icon: "🏷️", label: "테마별 성과 비교", color: C.usMid, bg: C.usLight,
      desc: "각 테마의 평균 상승률·승률 비교 및 강한 테마 추천" },
    { id: "stock", icon: "📊", label: "종목별 히스토리 분석", color: "#8060a0", bg: "#f0e8f8",
      desc: "종목별 반복 패턴·특이점 및 집중 추천 종목 도출" },
    { id: "rule", icon: "📋", label: "매매 규칙 검증", color: "#b09020", bg: C.yellow2,
      desc: "현재 매매 원칙이 실제 데이터와 얼마나 부합하는지 검증" },
    { id: "ipo", icon: "🌸", label: "공모주 성과 분석", color: "#2a9d8f", bg: C.mint2,
      desc: "증권사별·섹터별 공모주 수익률 패턴 분석" },
    { id: "us", icon: "🇺🇸", label: "미국주식 포트폴리오 진단", color: C.usBlue, bg: "#e8f0f8",
      desc: "미국주식 관심 종목 구성·테마 집중도·리스크 진단" },
  ];

  const buildPrompt = (mode) => {
    const krSummary = krRecords.map(r => {
      const ratio = r.tradingAmt && r.tradingAmt20 ? (r.tradingAmt / r.tradingAmt20).toFixed(1) : null;
      return `[${r.date}] ${r.stock}(${getThemes(r).join(",")}) | 상승률:${r.change}% | 거래대금배수:${ratio||"?"}x | 기관:${r.instFlow?r.instFlowType+fmtMillion(r.instFlow):"없음"} | 외인:${r.foreignFlow?r.foreignFlowType+fmtMillion(r.foreignFlow):"없음"} | 52주고점比:${r.high52wPct??"-"}% | D+1:${r.d1Change??"-"}% | D+2:${r.d2Change??"-"}% | 이유:${r.reason||""}`;
    }).join("\n");

    const usSummary = usCards.map(c =>
      `${c.stock}(${c.ticker}) | 테마:${getThemes(c).join(",")} | 시총:${fmtUSD(c.marketCapUSD||0)} | 현재:$${c.currentPrice||"-"} | 목표:$${c.targetPrice||"-"} | 종료:${c.closedReason?"Y":"N"} | 이유:${c.reason||""}`
    ).join("\n");

    const ipoSummary = ipoRecords.filter(r => r.sellPrice).map(r => {
      const profit = ((Number(r.sellPrice) - Number(r.ipoPrice)) / Number(r.ipoPrice) * 100).toFixed(1);
      return `${r.name}(${r.broker}) | 공모가:${Number(r.ipoPrice).toLocaleString()}원 | 매도가:${Number(r.sellPrice).toLocaleString()}원 | 수익률:${profit}%`;
    }).join("\n");

    const baseContext = `
당신은 서현의 주식 데이터를 분석하는 전문 투자 분석가입니다.
서현의 투자 스타일: 단기매매(1~3일), 대형주 위주, 테마 모멘텀 추종.

=== 국내주식 기록 (총 ${krRecords.length}건) ===
${krSummary}

=== 미국주식 관심종목 (총 ${usCards.length}건) ===
${usSummary}

=== 공모주 기록 (매도완료 ${ipoRecords.filter(r=>r.sellPrice).length}건) ===
${ipoSummary}

=== 현재 매매 원칙 ===
매수: ${principle.buy}
매도: ${principle.sell}
`;

    const prompts = {
      pattern: baseContext + `
위 국내주식 데이터를 분석해서 다음을 알려주세요:
1. **승률 패턴 분석**: D+1, D+2가 양수인 경우와 음수인 경우를 나눠서, 어떤 조건(거래대금배수, 기관/외인 수급, 상승률 크기, 52주 고점 거리)이 공통적으로 나타나는지 찾아주세요.
2. **최고 성과 조건**: 가장 수익이 좋았던 조건 조합 TOP 3
3. **위험 신호**: 손실이 났던 공통 패턴
4. **실행 가능한 매수 체크리스트**: 위 분석을 바탕으로 구체적인 조건 3~5가지

결과는 명확한 숫자와 함께 실용적으로 작성해주세요.`,

      theme: baseContext + `
테마별로 성과를 분석해주세요:
1. **테마별 평균 성과표**: 각 테마의 평균 상승률, D+1 평균, D+2 평균, 승률(%) 
2. **핫 테마 vs 식은 테마**: 현재 기준으로 모멘텀이 살아있는 테마와 주의할 테마
3. **테마 조합 인사이트**: 여러 테마가 겹친 종목의 성과 특성
4. **다음 집중할 테마 추천**: 근거와 함께 1~2개 추천

숫자 중심으로 간결하게 작성해주세요.`,

      stock: baseContext + `
종목별 패턴을 분석해주세요:
1. **반복 등장 종목 분석**: 여러 번 기록된 종목의 패턴 (언제 좋고 언제 나빴는지)
2. **종목별 특성 정리**: 각 종목의 강점/약점 1줄 요약
3. **집중 추천 종목**: 현재까지 데이터 기준으로 가장 좋은 성과를 보인 종목과 이유
4. **주의 종목**: 반복적으로 아쉬운 결과가 나온 종목

실용적인 결론 중심으로 써주세요.`,

      rule: baseContext + `
현재 매매 원칙을 실제 데이터로 검증해주세요:
1. **원칙 부합률**: 각 매수/매도 원칙이 실제 기록에서 얼마나 지켜졌는지 (%)
2. **원칙 지켰을 때 vs 안 지켰을 때**: 성과 차이 비교
3. **원칙의 유효성**: 각 원칙이 실제 수익에 도움이 됐는지 평가
4. **원칙 개선 제안**: 데이터 기반으로 추가하거나 수정할 원칙 2~3가지

솔직하고 냉정하게 평가해주세요.`,

      ipo: baseContext + `
공모주 기록을 분석해주세요:
1. **전체 성과 요약**: 총 수익, 평균 수익률, 승률
2. **증권사별 성과**: 어느 증권사에서 가장 좋은 결과가 나왔는지
3. **패턴 발견**: 상장일 당일 매도 vs 보유 중 어느 전략이 더 효과적이었는지
4. **손실 케이스 분석**: 공모가 하회 패턴이 있다면 어떤 특징인지
5. **공모주 전략 개선안**: 데이터 기반 추천 전략

구체적인 금액과 수익률 수치와 함께 분석해주세요.`,

      us: baseContext + `
미국주식 관심 종목 포트폴리오를 진단해주세요:
1. **포트폴리오 구성 분석**: 테마 집중도, 시총 분포, 리스크 분산 정도
2. **현재가 vs 목표가 갭 분석**: 업사이드가 가장 큰 종목과 이미 목표에 근접한 종목
3. **52주 포지션 분석**: 고점 대비 위치 기준 매수 타이밍 관점 분석
4. **실적 시즌 대비**: 곧 실적 발표 예정 종목 주목 포인트
5. **포트폴리오 개선 제안**: 추가·제거·비중 조정 관점에서 제안

투자 전략적 관점에서 실용적으로 작성해주세요.`,
    };
    return prompts[mode];
  };

  const runAnalysis = async (mode) => {
    setActiveMode(mode);
    setLoading(true);
    setResult(null);
    setError(null);

    const prompt = buildPrompt(mode);

    try {
      const res = await fetch("/.netlify/functions/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt }),
      });

      // status 확인
      if (!res.ok) {
        setError(`HTTP 오류: ${res.status} ${res.statusText}`);
        return;
      }

      const data = await res.json();

      if (data.error) {
        setError("오류: " + data.error);
        return;
      }

      const text = data.text || "";

      if (text) {
        setResult({ mode, text });
      } else {
        setError("응답에 텍스트가 없어요.");
      }
    } catch (e) {
      // fetch 실패 또는 JSON 파싱 실패
      const msg = e?.message || String(e);
      if (msg.includes("Invalid response format")) {
        // Artifact 환경 특수 처리: 직접 메시지 API 재시도
        setError("Artifact 환경 제한으로 API 호출이 차단됐어요. Netlify 배포 앱에서는 정상 작동해요.");
      } else {
        setError(`오류: ${msg}`);
      }
    } finally {
      setLoading(false);
    }
  };

  const modeInfo = MODES.find(m => m.id === activeMode);

  // 마크다운 간단 렌더링
  const renderText = (text) => {
    if (!text) return null;
    return text.split("\n").map((line, i) => {
      if (line.startsWith("### ")) return <div key={i} style={{fontWeight:800,fontSize:14,color:C.text,margin:"16px 0 6px",paddingBottom:4,borderBottom:`1.5px solid ${C.border}`}}>{line.slice(4)}</div>;
      if (line.startsWith("## ")) return <div key={i} style={{fontWeight:800,fontSize:15,color:C.pink1,margin:"18px 0 8px"}}>{line.slice(3)}</div>;
      if (line.startsWith("# ")) return <div key={i} style={{fontWeight:900,fontSize:16,color:C.text,margin:"20px 0 10px"}}>{line.slice(2)}</div>;
      if (line.startsWith("**") && line.endsWith("**") && line.length > 4) return <div key={i} style={{fontWeight:800,fontSize:13,color:C.text,margin:"10px 0 4px"}}>{line.slice(2,-2)}</div>;
      if (line.startsWith("- ") || line.startsWith("• ")) return <div key={i} style={{fontSize:13,color:C.text,padding:"3px 0 3px 16px",lineHeight:1.7,position:"relative"}}><span style={{position:"absolute",left:4,color:C.pink1}}>•</span>{line.slice(2)}</div>;
      if (/^\d+\./.test(line)) {
        const num = line.match(/^(\d+)\./)[1];
        return <div key={i} style={{fontSize:13,color:C.text,padding:"4px 0 4px 20px",lineHeight:1.7,position:"relative"}}><span style={{position:"absolute",left:0,fontWeight:800,color:C.pink1,fontSize:12}}>{num}.</span>{line.replace(/^\d+\.\s*/,"")}</div>;
      }
      if (line.trim() === "") return <div key={i} style={{height:6}}/>;
      // bold inline
      const parts = line.split(/\*\*(.+?)\*\*/g);
      if (parts.length > 1) {
        return <div key={i} style={{fontSize:13,color:C.text,lineHeight:1.75,padding:"1px 0"}}>{parts.map((p,j)=>j%2===1?<strong key={j} style={{color:C.text}}>{p}</strong>:p)}</div>;
      }
      return <div key={i} style={{fontSize:13,color:C.text,lineHeight:1.75,padding:"1px 0"}}>{line}</div>;
    });
  };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      {/* 상단 요약 카드 */}
      <div style={{background:`linear-gradient(135deg,#7b2ff7,${C.pink1})`,borderRadius:18,padding:18,color:"white"}}>
        <div style={{fontSize:22,marginBottom:6}}>🤖</div>
        <div style={{fontWeight:900,fontSize:16,marginBottom:4}}>AI 종합 분석</div>
        <div style={{fontSize:12,opacity:.85,lineHeight:1.6}}>
          국내주식 {krRecords.length}건 · 미국주식 {usCards.length}건 · 공모주 {ipoRecords.length}건의 데이터를 기반으로 Claude가 분석합니다.
        </div>
        <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
          {[
            {label:"기록된 종목", value:[...new Set(krRecords.map(r=>r.stock))].length+"개"},
            {label:"D+1 입력률", value:(krRecords.filter(r=>r.d1Change!=null).length/Math.max(krRecords.length,1)*100).toFixed(0)+"%"},
            {label:"공모주 승률", value:(ipoRecords.filter(r=>r.sellPrice&&Number(r.sellPrice)>=Number(r.ipoPrice)).length/Math.max(ipoRecords.filter(r=>r.sellPrice).length,1)*100).toFixed(0)+"%"},
          ].map(s=>(
            <div key={s.label} style={{background:"rgba(255,255,255,0.18)",borderRadius:10,padding:"6px 12px",backdropFilter:"blur(8px)"}}>
              <div style={{fontSize:10,opacity:.8,marginBottom:1}}>{s.label}</div>
              <div style={{fontWeight:800,fontSize:14}}>{s.value}</div>
            </div>
          ))}
        </div>
      </div>

      {/* 분석 모드 선택 */}
      <div style={{fontWeight:800,fontSize:13,color:C.sub,marginBottom:-4}}>분석 항목을 선택하세요</div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {MODES.map(m => (
          <button key={m.id} onClick={()=>runAnalysis(m.id)} disabled={loading}
            style={{display:"flex",alignItems:"center",gap:12,padding:"14px 16px",borderRadius:16,border:`1.5px solid ${activeMode===m.id?m.color:C.border}`,background:activeMode===m.id?m.bg:C.card,cursor:loading?"not-allowed":"pointer",textAlign:"left",opacity:loading&&activeMode!==m.id?0.5:1,transition:"all 0.15s"}}>
            <span style={{fontSize:22,flexShrink:0}}>{m.icon}</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:800,fontSize:13,color:activeMode===m.id?m.color:C.text,marginBottom:2}}>{m.label}</div>
              <div style={{fontSize:11,color:C.sub,lineHeight:1.4}}>{m.desc}</div>
            </div>
            {loading && activeMode===m.id
              ? <div style={{width:20,height:20,border:`2px solid ${m.color}`,borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite",flexShrink:0}}/>
              : <span style={{fontSize:13,color:C.sub,flexShrink:0}}>→</span>
            }
          </button>
        ))}
      </div>

      {/* 로딩 */}
      {loading && (
        <div style={{background:C.card,borderRadius:16,padding:24,textAlign:"center",border:`1.5px solid ${C.border}`}}>
          <div style={{fontSize:32,marginBottom:8}}>🔍</div>
          <div style={{fontWeight:700,fontSize:14,color:C.text,marginBottom:4}}>AI가 데이터를 분석하고 있어요...</div>
          <div style={{fontSize:12,color:C.sub}}>{modeInfo?.label} 진행 중</div>
        </div>
      )}

      {/* 에러 */}
      {error && (
        <div style={{background:C.red2,borderRadius:16,padding:16,border:`1.5px solid ${C.red1}`}}>
          <div style={{fontSize:13,color:"#c0392b",fontWeight:700}}>⚠️ {error}</div>
        </div>
      )}

      {/* 결과 */}
      {result && !loading && (
        <div style={{background:C.card,borderRadius:18,border:`1.5px solid ${MODES.find(m=>m.id===result.mode)?.color||C.border}`,overflow:"hidden"}}>
          <div style={{padding:"14px 16px",background:MODES.find(m=>m.id===result.mode)?.bg||C.pink3,borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:18}}>{MODES.find(m=>m.id===result.mode)?.icon}</span>
              <span style={{fontWeight:800,fontSize:14,color:MODES.find(m=>m.id===result.mode)?.color||C.text}}>
                {MODES.find(m=>m.id===result.mode)?.label} 결과
              </span>
            </div>
            <button onClick={()=>setResult(null)} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,color:C.sub}}>✕</button>
          </div>
          <div style={{padding:"16px 16px 20px",maxHeight:600,overflowY:"auto"}}>
            {renderText(result.text)}
          </div>
          <div style={{padding:"12px 16px",borderTop:`1px solid ${C.border}`,display:"flex",gap:8}}>
            <button onClick={()=>runAnalysis(result.mode)} style={{flex:1,padding:"9px",borderRadius:10,border:`1.5px solid ${C.border}`,background:C.cream1,fontWeight:700,fontSize:12,cursor:"pointer",color:C.sub}}>🔄 재분석</button>
            <PBtn onClick={()=>{navigator.clipboard?.writeText(result.text);}} style={{flex:2,padding:"9px"}}>📋 결과 복사</PBtn>
          </div>
        </div>
      )}

      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );
}

// ── 공모주 탭 ──
function IPOTab({records,setRecords,schedules,setSchedules,onAddRec,onAddSched}) {
  const [sub,setSub] = useState("calendar");
  const [detailRec,setDetailRec] = useState(null);
  const [detailSched,setDetailSched] = useState(null);
  const [sellDay,setSellDay] = useState(null);
  const [delTarget,setDelTarget] = useState(null);
  const [editRecModal,setEditRecModal] = useState(null);
  const [editSchedModal,setEditSchedModal] = useState(null);
  const [calMonth,setCalMonth] = useState(()=>{const t=new Date();return{y:t.getFullYear(),m:t.getMonth()};});
  const [openStat,setOpenStat] = useState(null);
  const [filterBroker,setFilterBroker] = useState("전체");
  const td = todayStr();

  const sold = records.filter(r=>r.sellPrice&&r.sellDate);
  const holding = records.filter(r=>!r.sellPrice||!r.sellDate).sort((a,b)=>(!a.listingDate?1:!b.listingDate?-1:a.listingDate.localeCompare(b.listingDate)));
  const fHolding = filterBroker==="전체" ? holding : holding.filter(r=>r.broker===filterBroker);
  const fSold = filterBroker==="전체" ? sold : sold.filter(r=>r.broker===filterBroker);
  const totalP = useMemo(()=>sold.reduce((a,r)=>a+(Number(r.sellPrice)-Number(r.ipoPrice))*Number(r.allocatedQty),0),[sold]);
  const pColor = (p) => p>=0?"#059669":"#dc2626";
  const fmtP = (p) => (p>=0?"+":"")+Number(p).toLocaleString("ko-KR")+"원";

  const yearlyS = useMemo(()=>{const m={};sold.forEach(r=>{const k=r.sellDate.slice(0,4);const p=(Number(r.sellPrice)-Number(r.ipoPrice))*Number(r.allocatedQty);if(!m[k])m[k]={profit:0,count:0,items:[]};m[k].profit+=p;m[k].count++;m[k].items.push(r);});return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0]));},[sold]);
  const monthlyS = useMemo(()=>{const m={};sold.forEach(r=>{const k=r.sellDate.slice(0,7);const p=(Number(r.sellPrice)-Number(r.ipoPrice))*Number(r.allocatedQty);if(!m[k])m[k]={profit:0,count:0,items:[]};m[k].profit+=p;m[k].count++;m[k].items.push(r);});return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0]));},[sold]);
  const brokerS = useMemo(()=>{const m={};sold.forEach(r=>{const p=(Number(r.sellPrice)-Number(r.ipoPrice))*Number(r.allocatedQty);if(!m[r.broker])m[r.broker]={count:0,profit:0,items:[]};m[r.broker].count++;m[r.broker].profit+=p;m[r.broker].items.push(r);});return Object.entries(m).sort((a,b)=>b[1].profit-a[1].profit);},[sold]);

  const calData = useMemo(()=>{
    const{y,m}=calMonth; const fd=new Date(y,m,1).getDay(); const dim=new Date(y,m+1,0).getDate();
    const cells=[]; for(let i=0;i<fd;i++)cells.push(null);
    for(let d=1;d<=dim;d++){
      const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const li=records.filter(r=>r.listingDate===ds);
      const si=records.filter(r=>r.sellDate===ds&&r.sellPrice);
      const dp=si.reduce((a,r)=>a+(Number(r.sellPrice)-Number(r.ipoPrice))*Number(r.allocatedQty),0);
      const ss=schedules.filter(s=>dateInRange(ds,s.subStart,s.subEnd));
      const ls=schedules.filter(s=>s.listingDate===ds);
      cells.push({d,dateStr:ds,listingItems:li,sellItems:si,dayProfit:dp,subScheds:ss,listingScheds:ls});
    }
    return cells;
  },[calMonth,records,schedules]);

  const ipoDateFmt = (d) => { if(!d)return"-"; const dt=new Date(d+"T00:00:00"); return`${d} (${DAYS_KO[dt.getDay()]})`; };
  const ipoDiff = (d) => { if(!d)return null; const t=new Date(); t.setHours(0,0,0,0); const dt=new Date(d+"T00:00:00"); dt.setHours(0,0,0,0); return Math.ceil((dt-t)/(1000*60*60*24)); };
  const subBtn = (id,label) => <button onClick={()=>setSub(id)} style={{padding:"5px 11px",borderRadius:20,border:"none",fontWeight:700,fontSize:12,cursor:"pointer",background:sub===id?`linear-gradient(135deg,${C.pink1},${C.coral1})`:"#f0e8f0",color:sub===id?"#fff":"#b08898"}}>{label}</button>;
  const saveRec = (rec, goHolding=false) => { const {_fromScheduleId,...clean}=rec; setRecords(p=>p.some(r=>r.id===clean.id)?p.map(r=>r.id===clean.id?clean:r):[...p,clean]); setEditRecModal(null); if(goHolding) setSub("holding"); };
  const saveSched = (s) => { setSchedules(p=>p.some(x=>x.id===s.id)?p.map(x=>x.id===s.id?s:x):[...p,s]); setEditSchedModal(null); };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
        {[{label:"💰 누적 수익",value:fmtP(totalP),color:pColor(totalP),bg:totalP>=0?"#f0fdf9":C.red2},{label:"🌷 보유 종목",value:holding.length+"종목",color:C.pink1,bg:C.pink3},{label:"✅ 완료 종목",value:sold.length+"종목",color:"#c0607a",bg:C.pink2}].map(c=>(
          <div key={c.label} style={{background:c.bg,borderRadius:14,padding:"10px 8px",border:`1.5px solid ${C.border}`,textAlign:"center"}}>
            <div style={{fontSize:10,color:C.sub,marginBottom:3,fontWeight:600}}>{c.label}</div>
            <div style={{fontSize:13,fontWeight:800,color:c.color}}>{c.value}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:5,flexWrap:"wrap",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{subBtn("calendar","📅 달력")}{subBtn("schedule","📌 청약")}{subBtn("holding","🌷 보유")}{subBtn("sold","✅ 매도")}{subBtn("stats","📊 통계")}</div>
        {(sub==="holding"||sub==="sold")&&<select value={filterBroker} onChange={e=>setFilterBroker(e.target.value)} style={{fontSize:11,padding:"4px 8px",borderRadius:8,border:`1.5px solid ${C.border}`,color:C.sub,background:"#fff"}}><option>전체</option>{BROKERS.map(b=><option key={b}>{b}</option>)}</select>}
      </div>

      {sub==="calendar"&&<div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,background:C.card,borderRadius:14,padding:"10px 14px",border:`1.5px solid ${C.border}`}}>
          <button onClick={()=>setCalMonth(p=>{const d=new Date(p.y,p.m-1);return{y:d.getFullYear(),m:d.getMonth()};})} style={{background:C.pink2,border:"none",borderRadius:8,width:28,height:28,fontSize:14,cursor:"pointer",color:"#db2777"}}>‹</button>
          <span style={{fontWeight:800,fontSize:14,color:C.text}}>🌸 {calMonth.y}년 {calMonth.m+1}월</span>
          <button onClick={()=>setCalMonth(p=>{const d=new Date(p.y,p.m+1);return{y:d.getFullYear(),m:d.getMonth()};})} style={{background:C.pink2,border:"none",borderRadius:8,width:28,height:28,fontSize:14,cursor:"pointer",color:"#db2777"}}>›</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:4}}>{["일","월","화","수","목","금","토"].map((d,i)=><div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,padding:"3px 0",color:i===0?"#f472b6":i===6?"#a78bfa":C.sub}}>{d}</div>)}</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:3}}>
          {calData.map((cell,i)=>{
            if(!cell)return <div key={"e"+i}/>;
            const isToday=cell.dateStr===td; const dow=new Date(cell.dateStr+"T00:00:00").getDay();
            const hasAny=cell.listingItems.length>0||cell.sellItems.length>0||cell.subScheds.length>0||cell.listingScheds.length>0;
            return (
              <div key={cell.dateStr} style={{background:isToday?C.pink2:hasAny?C.pink3:"#fff",border:isToday?`2px solid ${C.pink1}`:`1px solid ${C.border}`,borderRadius:9,padding:"4px 2px",minHeight:68,minWidth:0,overflow:"hidden"}}>
                <div style={{fontSize:11,fontWeight:isToday?800:500,color:isToday?C.pink1:dow===0?"#f472b6":dow===6?"#a78bfa":C.text,textAlign:"center",marginBottom:2}}>{cell.d}</div>
                {cell.subScheds.map(s=><div key={s.id} onClick={()=>setDetailSched(s)} style={{fontSize:8,fontWeight:700,padding:"1px 2px",borderRadius:3,marginBottom:2,background:C.blue2,color:"#4a7ab5",textAlign:"center",cursor:"pointer",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>📋{s.name}</div>)}
                {cell.listingScheds.map(s=><div key={s.id} onClick={()=>setDetailSched(s)} style={{fontSize:8,fontWeight:700,padding:"1px 2px",borderRadius:3,marginBottom:2,background:C.mint2,color:"#059669",textAlign:"center",cursor:"pointer",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>🟢{s.name}</div>)}
                {cell.listingItems.map(r=><div key={r.id} onClick={()=>setDetailRec(r)} style={{fontSize:8,fontWeight:700,padding:"1px 2px",borderRadius:3,marginBottom:2,background:r.sellPrice?C.mint2:C.pink2,color:r.sellPrice?"#059669":C.pink1,textAlign:"center",cursor:"pointer",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>🌸{r.name}</div>)}
                {cell.sellItems.length>0&&<div onClick={()=>{if(cell.sellItems.length===1)setDetailRec(cell.sellItems[0]);else setSellDay(cell);}} style={{fontSize:8,fontWeight:800,textAlign:"center",marginTop:2,cursor:"pointer",background:cell.dayProfit>=0?C.mint2:C.red2,borderRadius:3,padding:"1px 2px",color:pColor(cell.dayProfit)}}>{cell.dayProfit>=0?"+":""}{Number(cell.dayProfit).toLocaleString("ko-KR")}원</div>}
              </div>
            );
          })}
        </div>
      </div>}

      {sub==="schedule"&&<div style={{display:"flex",flexDirection:"column",gap:8}}>
        {schedules.length===0&&<div style={{textAlign:"center",color:C.sub,padding:32}}>등록된 청약 일정이 없어요 🌸</div>}
        {[...schedules].sort((a,b)=>a.subStart.localeCompare(b.subStart)).map(s=>{
          const dd=ipoDiff(s.subStart); const isActive=dateInRange(td,s.subStart,s.subEnd); const isDone=td>s.subEnd;
          return (
            <div key={s.id} style={{background:C.card,borderRadius:14,padding:"12px 14px",border:`1.5px solid ${C.border}`,borderLeft:`4px solid ${isActive?C.pink1:isDone?C.sub:C.coral1}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div onClick={()=>setDetailSched(s)} style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",flex:1,cursor:"pointer"}}>
                  <span style={{fontWeight:800,fontSize:14,color:C.text}}>📌 {s.name}</span>
                  <span style={{fontSize:11,padding:"2px 7px",borderRadius:20,background:C.pink3,color:C.pink1,fontWeight:700}}>{s.broker}</span>
                  {s.subscribeQty&&<span style={{fontSize:11,padding:"2px 7px",borderRadius:20,background:C.yellow2,color:"#b09020",fontWeight:700}}>청약 {Number(s.subscribeQty).toLocaleString()}주</span>}
                  {isActive?<span style={{fontSize:11,padding:"2px 7px",borderRadius:20,background:C.pink2,color:"#c0607a",fontWeight:700}}>🔥 청약 중</span>:isDone?<span style={{fontSize:11,padding:"2px 7px",borderRadius:20,background:"#f3f4f6",color:"#6b7280",fontWeight:700}}>마감</span>:<span style={{fontSize:11,padding:"2px 7px",borderRadius:20,background:C.pink3,color:C.pink1,fontWeight:700}}>{dd>0?`D-${dd}`:"오늘!"}</span>}
                </div>
                <div style={{display:"flex",gap:5,flexShrink:0}}>
                  <button onClick={()=>setEditSchedModal(s)} style={{fontSize:11,padding:"3px 8px",borderRadius:7,border:`1px solid ${C.border}`,cursor:"pointer",background:C.pink3,color:C.sub}}>✏️</button>
                  <button onClick={()=>setDelTarget({id:s.id,type:"sched"})} style={{fontSize:11,padding:"3px 8px",borderRadius:7,border:`1px solid ${C.red1}`,cursor:"pointer",background:C.red2,color:"#dc2626"}}>🗑</button>
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6,marginTop:10}}>
                <IBox label="📅 청약 시작" value={ipoDateFmt(s.subStart)}/><IBox label="📅 청약 마감" value={ipoDateFmt(s.subEnd)}/><IBox label="💸 환불일" value={ipoDateFmt(s.refundDate)}/><IBox label="🚀 상장일" value={ipoDateFmt(s.listingDate)}/>
              </div>
              {s.memo&&<div style={{marginTop:6,fontSize:11,color:C.sub}}>💬 {s.memo}</div>}
              {isDone&&<button onClick={()=>setEditRecModal({id:`i${Date.now()}`,name:s.name,broker:s.broker,subscribeQty:s.subscribeQty||"",allocatedQty:"",ipoPrice:"",listingDate:s.listingDate||"",sellPrice:"",sellDate:"",memo:s.memo||"",_fromScheduleId:s.id})} style={{marginTop:8,width:"100%",background:`linear-gradient(135deg,${C.pink1},${C.coral1})`,color:"#fff",border:"none",borderRadius:8,padding:"8px",fontWeight:700,fontSize:12,cursor:"pointer"}}>🌷 배정 결과 입력하기 →</button>}
            </div>
          );
        })}
      </div>}

      {sub==="holding"&&<div style={{display:"flex",flexDirection:"column",gap:8}}>
        {fHolding.length===0&&<div style={{textAlign:"center",color:C.sub,padding:32}}>보유 중인 종목이 없어요 🌸</div>}
        {fHolding.map(r=>{
          const dd=ipoDiff(r.listingDate); const listed=dd!==null&&dd<=0;
          return (
            <div key={r.id} style={{background:C.card,borderRadius:14,padding:"12px 14px",border:`1.5px solid ${C.border}`,cursor:"pointer"}} onClick={()=>setDetailRec(r)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  <span style={{fontWeight:800,fontSize:14,color:C.text}}>🌷 {r.name}</span>
                  <span style={{fontSize:11,padding:"2px 7px",borderRadius:20,background:C.pink3,color:C.pink1,fontWeight:700}}>{r.broker}</span>
                  {listed?<span style={{fontSize:11,padding:"2px 7px",borderRadius:20,background:C.mint2,color:"#059669",fontWeight:700}}>🎉 상장완료</span>:dd===0?<span style={{fontSize:11,padding:"2px 7px",borderRadius:20,background:C.pink2,color:"#c0607a",fontWeight:700}}>🚀 오늘!</span>:dd>0?<span style={{fontSize:11,padding:"2px 7px",borderRadius:20,background:C.blue2,color:"#4a7ab5",fontWeight:700}}>D-{dd}</span>:null}
                </div>
                <div style={{display:"flex",gap:5}} onClick={e=>e.stopPropagation()}>
                  <button onClick={()=>setEditRecModal(r)} style={{fontSize:11,padding:"3px 8px",borderRadius:7,border:`1px solid ${C.border}`,cursor:"pointer",background:C.pink3,color:C.sub}}>✏️</button>
                  <button onClick={()=>setDelTarget({id:r.id,type:"rec"})} style={{fontSize:11,padding:"3px 8px",borderRadius:7,border:`1px solid ${C.red1}`,cursor:"pointer",background:C.red2,color:"#dc2626"}}>🗑</button>
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6,marginTop:10}}>
                <IBox label="청약 수량" value={r.subscribeQty?Number(r.subscribeQty).toLocaleString()+"주":"-"}/><IBox label="배정 수량" value={Number(r.allocatedQty).toLocaleString()+"주"}/><IBox label="공모가" value={Number(r.ipoPrice).toLocaleString()+"원"}/><IBox label="🚀 상장일" value={ipoDateFmt(r.listingDate)}/>
              </div>
              {r.memo&&<div style={{marginTop:6,fontSize:11,color:C.sub}}>💬 {r.memo}</div>}
              {listed&&<button onClick={e=>{e.stopPropagation();setEditRecModal(r);}} style={{marginTop:8,width:"100%",background:`linear-gradient(135deg,${C.pink1},${C.coral1})`,color:"#fff",border:"none",borderRadius:8,padding:"8px",fontWeight:700,fontSize:12,cursor:"pointer"}}>💰 매도가 입력하기</button>}
            </div>
          );
        })}
      </div>}

      {sub==="sold"&&<div style={{display:"flex",flexDirection:"column",gap:8}}>
        {fSold.length===0&&<div style={{textAlign:"center",color:C.sub,padding:32}}>매도 완료 종목이 없어요 🌸</div>}
        {fSold.map(r=>{
          const profit=(Number(r.sellPrice)-Number(r.ipoPrice))*Number(r.allocatedQty);
          const rate=((Number(r.sellPrice)-Number(r.ipoPrice))/Number(r.ipoPrice)*100).toFixed(1);
          return (
            <div key={r.id} onClick={()=>setDetailRec(r)} style={{background:C.card,borderRadius:14,padding:"12px 14px",border:`1.5px solid ${C.border}`,cursor:"pointer"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  <span style={{fontWeight:800,fontSize:14,color:C.text}}>✅ {r.name}</span>
                  <span style={{fontSize:11,padding:"2px 7px",borderRadius:20,background:C.pink3,color:C.pink1,fontWeight:700}}>{r.broker}</span>
                  <span style={{fontSize:11,padding:"2px 7px",borderRadius:20,background:profit>=0?C.mint2:C.red2,color:pColor(profit),fontWeight:700}}>{fmtP(profit)}</span>
                  <span style={{fontSize:11,padding:"2px 7px",borderRadius:20,background:profit>=0?"#e8faf4":C.red2,color:pColor(profit),fontWeight:700}}>{rate>0?"+":""}{rate}%</span>
                </div>
                <div style={{display:"flex",gap:5}} onClick={e=>e.stopPropagation()}>
                  <button onClick={()=>setEditRecModal(r)} style={{fontSize:11,padding:"3px 8px",borderRadius:7,border:`1px solid ${C.border}`,cursor:"pointer",background:C.pink3,color:C.sub}}>✏️</button>
                  <button onClick={()=>setDelTarget({id:r.id,type:"rec"})} style={{fontSize:11,padding:"3px 8px",borderRadius:7,border:`1px solid ${C.red1}`,cursor:"pointer",background:C.red2,color:"#dc2626"}}>🗑</button>
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr",gap:6,marginTop:10}}>
                <IBox label="배정 수량" value={Number(r.allocatedQty).toLocaleString()+"주"}/><IBox label="공모가" value={Number(r.ipoPrice).toLocaleString()+"원"}/><IBox label="매도가" value={Number(r.sellPrice).toLocaleString()+"원"}/><IBox label="수익률" value={(rate>0?"+":"")+rate+"%"} highlight={pColor(profit)}/><IBox label="상장일" value={ipoDateFmt(r.listingDate)}/>
              </div>
              {r.memo&&<div style={{marginTop:6,fontSize:11,color:C.sub}}>💬 {r.memo}</div>}
            </div>
          );
        })}
      </div>}

      {sub==="stats"&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div style={{background:`linear-gradient(135deg,${C.pink2},${C.coral2})`,borderRadius:16,padding:16,textAlign:"center",border:`1.5px solid ${C.pink1}`}}>
          <div style={{fontSize:12,color:C.sub,marginBottom:4}}>🏆 최종 누적 수익</div>
          <div style={{fontSize:26,fontWeight:800,color:pColor(totalP)}}>{fmtP(totalP)}</div>

            {sellDay.sellItems.map(r=>{
              const profit=(Number(r.sellPrice)-Number(r.ipoPrice))*Number(r.allocatedQty);
              const rate=((Number(r.sellPrice)-Number(r.ipoPrice))/Number(r.ipoPrice)*100).toFixed(1);
              return (
                <div key={r.id} onClick={()=>{setSellDay(null);setDetailRec(r);}} style={{background:C.pink3,borderRadius:11,padding:"11px 13px",cursor:"pointer",border:`1px solid ${C.border}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
                    <div style={{display:"flex",alignItems:"center",gap:5}}><span style={{fontWeight:700,fontSize:13,color:C.text}}>🌸 {r.name}</span><span style={{fontSize:10,padding:"1px 6px",borderRadius:20,background:C.pink3,color:C.pink1}}>{r.broker}</span></div>
                    <span style={{fontWeight:800,fontSize:13,color:profit>=0?"#059669":"#dc2626"}}>{(profit>=0?"+":"")+profit.toLocaleString("ko-KR")}원</span>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:5}}>
                    <IBox label="공모가" value={Number(r.ipoPrice).toLocaleString()+"원"}/><IBox label="매도가" value={Number(r.sellPrice).toLocaleString()+"원"}/><IBox label="배정수량" value={Number(r.allocatedQty).toLocaleString()+"주"}/><IBox label="수익률" value={(rate>0?"+":"")+rate+"%"} highlight={profit>=0?"#059669":"#dc2626"}/>

      {delTarget&&<div style={{position:"fixed",inset:0,zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:16,background:"rgba(58,37,53,0.4)"}}>
        <div style={{background:C.card,borderRadius:18,padding:24,width:"100%",maxWidth:280,textAlign:"center",border:`1.5px solid ${C.border}`}}>
          <div style={{fontSize:32,marginBottom:8}}>🗑️</div>
          <div style={{fontWeight:800,fontSize:15,color:C.text,marginBottom:5}}>정말 삭제할까요?</div>

      {editSchedModal&&<IpoScheduleModal initial={editSchedModal.id?editSchedModal:null} onSave={saveSched} onClose={()=>setEditSchedModal(null)}/>}
    </div>
  );
}

// ── 메인 앱 ──
function App({user}) {
  const fb = window.__firebase;
  const [krRecords,setKrRecords] = useState([]);
  const [usCards,setUsCards] = useState([]);
  const [memos,setMemos] = useState([]);
  const [principle,setPrinciple] = useState({buy:"",sell:""});
  const [ipoRecords,setIpoRecords] = useState([]);
  const [ipoSchedules,setIpoSchedules] = useState([]);
  const [tab,setTab] = useState("home");
  const [search,setSearch] = useState("");
  const [openThemes,setOpenThemes] = useState({});
  const [openStocks,setOpenStocks] = useState({});
  const [favorites,setFavorites] = useState(new Set());
  const [ci,setCi] = useState({});
  const [leaders,setLeaders] = useState({});
  const [modal,setModal] = useState(null);
  const [delModal,setDelModal] = useState(null);
  const [memoModal,setMemoModal] = useState(null);
  const [memoDelModal,setMemoDelModal] = useState(null);
  const [showPending,setShowPending] = useState(false);
  const [emojiTarget,setEmojiTarget] = useState(null);
  const [leaderModal,setLeaderModal] = useState(null);
  const [earningsExp,setEarningsExp] = useState(false);
  const [holdings,setHoldings] = useState([]);
  const [favKROpen,setFavKROpen] = useState(true);
  const [favUSOpen,setFavUSOpen] = useState(true);
  const [editP,setEditP] = useState(false);
  const [pForm,setPForm] = useState({buy:"",sell:""});
  const [ipoAddRec,setIpoAddRec] = useState(false);
  const [buyModal,setBuyModal] = useState(null);
  const [sellModal,setSellModal] = useState(null);
  const [ipoAddSched,setIpoAddSched] = useState(false);
  const fileRef = useRef();

  const [saving, setSaving] = React.useState(false);

  // Firebase 실시간 리스너
  React.useEffect(()=>{
    if(!user) return;
    const uid = user.uid;
    const unsubKR = fb.onSnapshot(fb.collection(fb.db,`users/${uid}/krRecords`),snap=>{setKrRecords(snap.docs.map(d=>d.data()));});
    const unsubUS = fb.onSnapshot(fb.collection(fb.db,`users/${uid}/usCards`),snap=>{setUsCards(snap.docs.map(d=>d.data()));});
    const unsubMemos = fb.onSnapshot(fb.collection(fb.db,`users/${uid}/memos`),snap=>{setMemos(snap.docs.map(d=>d.data()));});
    const unsubIPORec = fb.onSnapshot(fb.collection(fb.db,`users/${uid}/ipoRecords`),snap=>{setIpoRecords(snap.docs.map(d=>d.data()));});
    const unsubIPOSched = fb.onSnapshot(fb.collection(fb.db,`users/${uid}/ipoSchedules`),snap=>{setIpoSchedules(snap.docs.map(d=>d.data()));});
    const unsubMeta = fb.onSnapshot(fb.doc(fb.db,`users/${uid}/meta/main`),snap=>{
      if(snap.exists()){
        const d=snap.data();
        if(d.principle) setPrinciple(d.principle);
        if(d.favorites) setFavorites(new Set(d.favorites));
        if(d.customIcons) setCi(d.customIcons);
        if(d.themeLeaders) setLeaders(d.themeLeaders);
        if(d.holdings) setHoldings(d.holdings);
      }
    });
    return()=>{unsubKR();unsubUS();unsubMemos();unsubIPORec();unsubIPOSched();unsubMeta();};
  },[user]);

  const saveMeta = async(data)=>{
    if(!user) return; setSaving(true);
    try{await fb.setDoc(fb.doc(fb.db,`users/${user.uid}/meta/main`),data,{merge:true});}catch(e){console.error(e);}
    setSaving(false);
  };

  const logout = async()=>{
    await fb.signOut(fb.auth);
    setKrRecords([]);setUsCards([]);setMemos([]);setIpoRecords([]);setIpoSchedules([]);setFavorites(new Set());
  };


  const toggleFav = (s) => { const n=new Set(favorites); n.has(s)?n.delete(s):n.add(s); setFavorites(n); saveMeta({favorites:[...n]}); };
  const saveHolding = (info) => { const next=[...holdings.filter(h=>h.stock!==info.stock),info]; setHoldings(next); saveMeta({holdings:next}); };
  const deleteHolding = (stock) => { const next=holdings.filter(h=>h.stock!==stock); setHoldings(next); saveMeta({holdings:next}); };
  const getHolding = (stock) => holdings.find(h=>h.stock===stock);
  const daysSince = (d) => { if(!d)return 0; const a=new Date(d),b=new Date(); a.setHours(0,0,0,0);b.setHours(0,0,0,0); return Math.floor((b-a)/86400000); };
  const setIcon = (t,e) => { const next={...ci,[t]:e}; setCi(next); saveMeta({customIcons:next}); };
  const saveLeader = (t,s) => { const next={...leaders,[t]:s}; setLeaders(next); saveMeta({themeLeaders:next}); setLeaderModal(null); };
  const saveKR = async(rec)=>{if(!user)return;setSaving(true);try{await fb.setDoc(fb.doc(fb.db,`users/${user.uid}/krRecords/${rec.id}`),rec);}catch(e){console.error(e);}setSaving(false);setModal(null);};
  const deleteKR = async(id)=>{if(!user)return;try{await fb.deleteDoc(fb.doc(fb.db,`users/${user.uid}/krRecords/${id}`));}catch(e){console.error(e);}setDelModal(null);};
  const saveUS = async(card)=>{if(!user)return;setSaving(true);try{await fb.setDoc(fb.doc(fb.db,`users/${user.uid}/usCards/${card.id}`),card);}catch(e){console.error(e);}setSaving(false);setModal(null);};
  const deleteUS = async(id)=>{if(!user)return;try{await fb.deleteDoc(fb.doc(fb.db,`users/${user.uid}/usCards/${id}`));}catch(e){console.error(e);}setDelModal(null);};
  const saveMemo = async(memo)=>{if(!user)return;setSaving(true);try{await fb.setDoc(fb.doc(fb.db,`users/${user.uid}/memos/${memo.id}`),memo);}catch(e){console.error(e);}setSaving(false);setMemoModal(null);};
  const deleteMemo = async(id)=>{if(!user)return;try{await fb.deleteDoc(fb.doc(fb.db,`users/${user.uid}/memos/${id}`));}catch(e){console.error(e);}setMemoDelModal(null);};
  const saveP = () => { setPrinciple(pForm); saveMeta({principle:pForm}); setEditP(false); };

  // IPO Firebase wrappers
  const saveIpoRec = async(rec)=>{if(!user)return;setSaving(true);try{await fb.setDoc(fb.doc(fb.db,`users/${user.uid}/ipoRecords/${rec.id}`),rec);}catch(e){console.error(e);}setSaving(false);};
  const deleteIpoRec = async(id)=>{if(!user)return;try{await fb.deleteDoc(fb.doc(fb.db,`users/${user.uid}/ipoRecords/${id}`));}catch(e){console.error(e);}};
  const saveIpoSched = async(s)=>{if(!user)return;setSaving(true);try{await fb.setDoc(fb.doc(fb.db,`users/${user.uid}/ipoSchedules/${s.id}`),s);}catch(e){console.error(e);}setSaving(false);};
  const deleteIpoSched = async(id)=>{if(!user)return;try{await fb.deleteDoc(fb.doc(fb.db,`users/${user.uid}/ipoSchedules/${id}`));}catch(e){console.error(e);}};
  const setIpoRecordsWrapped=(updater)=>{const next=typeof updater==="function"?updater(ipoRecords):updater;next.forEach(rec=>{const ex=ipoRecords.find(r=>r.id===rec.id);if(!ex||JSON.stringify(ex)!==JSON.stringify(rec))saveIpoRec(rec);});ipoRecords.forEach(rec=>{if(!next.find(r=>r.id===rec.id))deleteIpoRec(rec.id);});};
  const setIpoSchedulesWrapped=(updater)=>{const next=typeof updater==="function"?updater(ipoSchedules):updater;next.forEach(s=>{const ex=ipoSchedules.find(x=>x.id===s.id);if(!ex||JSON.stringify(ex)!==JSON.stringify(s))saveIpoSched(s);});ipoSchedules.forEach(s=>{if(!next.find(x=>x.id===s.id))deleteIpoSched(s.id);});};

  const exportJSON = () => {
    const data = {krRecords,usCards,memos,ipoRecords,ipoSchedules,favorites:[...favorites],principle,customIcons:ci,themeLeaders:leaders};
    const url = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
    const a = document.createElement("a"); a.href=url; a.download="seohyun_note.json"; a.click(); URL.revokeObjectURL(url);
  };
  const importJSON = (e) => {
    const file = e.target.files[0]; if(!file)return;
    const reader = new FileReader();
    reader.onload = async ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if(!user) return; setSaving(true);
        const uid = user.uid;
        const batch = fb.writeBatch(fb.db);
        (d.krRecords||[]).forEach(rec=>batch.set(fb.doc(fb.db,`users/${uid}/krRecords/${rec.id}`),rec));
        (d.usCards||[]).forEach(card=>batch.set(fb.doc(fb.db,`users/${uid}/usCards/${card.id}`),card));
        (d.memos||[]).forEach(memo=>batch.set(fb.doc(fb.db,`users/${uid}/memos/${memo.id}`),memo));
        (d.ipoRecords||[]).forEach(rec=>batch.set(fb.doc(fb.db,`users/${uid}/ipoRecords/${rec.id}`),rec));
        (d.ipoSchedules||[]).forEach(s=>batch.set(fb.doc(fb.db,`users/${uid}/ipoSchedules/${s.id}`),s));
        await batch.commit();
        await fb.setDoc(fb.doc(fb.db,`users/${uid}/meta/main`),{favorites:[...(new Set(d.favorites||[]))],principle:d.principle||{buy:"",sell:""},customIcons:d.customIcons||{},themeLeaders:d.themeLeaders||{}},{merge:true});
        setSaving(false);
        alert("불러오기 완료! ✅");
      } catch(err) { console.error(err); alert("JSON 파일을 읽을 수 없어요 🥺"); }
      e.target.value = "";
    };
    reader.readAsText(file);
  };

  const exportKRCSV = () => {
    const BOM="\uFEFF", h="날짜,테마,종목명,시가총액(억),상승률(%),거래대금(백만),거래대금평균(백만),기관수급,외인수급,52주고점比,D+1,D+2,기업설명,상승이유\n";
    const rows = krRecords.map(r=>[r.date,getThemes(r).join("|"),r.stock,r.marketCap,r.change,r.tradingAmt||"",r.tradingAmt20||"",r.instFlow?(r.instFlowType+r.instFlow):"",r.foreignFlow?(r.foreignFlowType+r.foreignFlow):"",(r.high52wPct??""),(r.d1Change??""),(r.d2Change??""),`"${(r.desc||"").replace(/"/g,'""')}"`,`"${(r.reason||"").replace(/"/g,'""')}"`].join(",")).join("\n");
    const url=URL.createObjectURL(new Blob([BOM+h+rows],{type:"text/csv;charset=utf-8;"}));
    const a=document.createElement("a"); a.href=url; a.download="seohyun_kr.csv"; a.click(); URL.revokeObjectURL(url);
  };
  const exportUSCSV = () => {
    const BOM="\uFEFF", h="등록일,테마,종목명,티커,시총(USD),관심이유,실적발표일,현재가,52주고점,52주저점,목표주가,종료이유\n";
    const rows = usCards.map(c=>[c.addedDate,getThemes(c).join("|"),c.stock,c.ticker||"",c.marketCapUSD||"",`"${(c.reason||"").replace(/"/g,'""')}"`,c.earningsDate||"",c.currentPrice||"",c.high52w||"",c.low52w||"",c.targetPrice||"",`"${(c.closedReason||"").replace(/"/g,'""')}"`].join(",")).join("\n");
    const url=URL.createObjectURL(new Blob([BOM+h+rows],{type:"text/csv;charset=utf-8;"}));
    const a=document.createElement("a"); a.href=url; a.download="seohyun_us.csv"; a.click(); URL.revokeObjectURL(url);
  };
  const exportIPOCSV = () => {
    const BOM="\uFEFF", h="종목명,증권사,청약수량,배정수량,공모가,상장일,매도가,매도일,메모\n";
    const rows = ipoRecords.map(r=>[r.name,r.broker,r.subscribeQty||"",r.allocatedQty,r.ipoPrice,r.listingDate||"",r.sellPrice||"",r.sellDate||"",`"${(r.memo||"").replace(/"/g,'""')}"`].join(",")).join("\n");
    const url=URL.createObjectURL(new Blob([BOM+h+rows],{type:"text/csv;charset=utf-8;"}));
    const a=document.createElement("a"); a.href=url; a.download="seohyun_ipo.csv"; a.click(); URL.revokeObjectURL(url);
  };

  const q = search.trim().toLowerCase();
  const filteredKR = useMemo(()=>q?krRecords.filter(r=>[...getThemes(r),r.stock,r.desc,r.reason].some(v=>String(v||"").toLowerCase().includes(q))):krRecords,[krRecords,q]);
  const filteredUS = useMemo(()=>q?usCards.filter(c=>[...getThemes(c),c.stock,c.ticker,c.reason,...(c.news||[]).map(n=>n.content)].some(v=>String(v||"").toLowerCase().includes(q))):usCards,[usCards,q]);
  const krGroups = useMemo(()=>{const map={};filteredKR.forEach(r=>getThemes(r).forEach(t=>{if(!map[t])map[t]=[];map[t].push(r);}));return Object.entries(map).sort(([,a],[,b])=>new Date(Math.max(...b.map(r=>new Date(r.date))))-new Date(Math.max(...a.map(r=>new Date(r.date)))));},[filteredKR]);
  const sortedUS = useMemo(()=>{const td=todayISO();return[...filteredUS].sort((a,b)=>{const ac=!!a.closedReason,bc=!!b.closedReason;if(ac!==bc)return ac?1:-1;if(!a.earningsDate&&!b.earningsDate)return 0;if(!a.earningsDate)return 1;if(!b.earningsDate)return -1;const aF=a.earningsDate>=td,bF=b.earningsDate>=td;if(aF&&bF)return a.earningsDate.localeCompare(b.earningsDate);if(!aF&&!bF)return b.earningsDate.localeCompare(a.earningsDate);return aF?-1:1;});},[filteredUS]);
  const pending = useMemo(()=>krRecords.filter(r=>r.d1Change==null||r.d2Change==null),[krRecords]);
  const upcomingE = useMemo(()=>usCards.filter(c=>!c.closedReason&&c.earningsDate).map(c=>({...c,dday:daysDiff(c.earningsDate)*-1})).filter(c=>c.dday>=-7).sort((a,b)=>a.dday-b.dday),[usCards]);

  const hBtn = {background:"rgba(255,255,255,0.5)",border:"1px solid rgba(255,255,255,0.7)",borderRadius:10,padding:"6px 11px",fontSize:12,fontWeight:700,color:C.text,cursor:"pointer"};

  const TABS = [
    {id:"home",label:"국내주식",icon:"🇰🇷",ac:C.pink1,ab:C.pink3},
    {id:"us",label:"미국주식",icon:"🇺🇸",ac:"#4a7ab5",ab:C.usLight},
    {id:"ipo",label:"공모주",icon:"🌸",ac:"#c0607a",ab:C.pink2},
    {id:"fav",label:"관심종목",icon:"🌿",ac:"#2a9d8f",ab:C.mint2},
    {id:"ai",label:"AI분석",icon:"🤖",ac:"#7b2ff7",ab:"#f0e8ff"},
    {id:"memo",label:"메모",icon:"📓",ac:"#b06040",ab:C.coral2},
  ];

  return (
    <div style={{fontFamily:"'Pretendard','Apple SD Gothic Neo',sans-serif",background:C.bg,minHeight:"100vh",paddingBottom:80}}>
      <input ref={fileRef} type="file" accept=".json" onChange={importJSON} style={{display:"none"}}/>

      <div style={{background:`linear-gradient(135deg,${C.pink2},${C.coral2})`,padding:"24px 16px 16px",boxShadow:`0 2px 16px ${C.pink1}30`}}>
        <div style={{maxWidth:672,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:40,height:40,borderRadius:14,background:"rgba(255,255,255,0.6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>🌸</div>
              <div><div style={{fontWeight:900,fontSize:17,color:C.text}}>Seohyun's Note</div><div style={{fontSize:11,color:C.text,opacity:.65}}>{user?.displayName||"서현"} · {saving?"저장 중...":"동기화됨 ✓"}</div></div>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {tab==="home"&&<><button onClick={exportKRCSV} style={hBtn}>📥 CSV</button>{pending.length>0&&<button onClick={()=>setShowPending(p=>!p)} style={{...hBtn,background:showPending?"rgba(247,196,168,0.8)":"rgba(255,255,255,0.5)",color:showPending?"#b06040":C.text}}>🔔 {pending.length}건</button>}<button onClick={()=>setModal({type:"addKR"})} style={{background:C.card,border:"none",borderRadius:10,padding:"6px 11px",fontSize:12,fontWeight:800,color:C.pink1,cursor:"pointer"}}>🌸 기록 추가</button></>}
              {tab==="us"&&<><button onClick={exportUSCSV} style={hBtn}>📥 CSV</button><button onClick={()=>setModal({type:"addUS"})} style={{background:C.card,border:"none",borderRadius:10,padding:"6px 11px",fontSize:12,fontWeight:800,color:C.usMid,cursor:"pointer"}}>🌊 기록 추가</button></>}
              {tab==="ipo"&&<><button onClick={exportIPOCSV} style={hBtn}>📥 CSV</button><button onClick={()=>setIpoAddSched(true)} style={{background:"rgba(255,255,255,0.7)",border:"none",borderRadius:10,padding:"6px 11px",fontSize:12,fontWeight:800,color:C.usMid,cursor:"pointer"}}>📌 일정 추가</button><button onClick={()=>setIpoAddRec(true)} style={{background:C.card,border:"none",borderRadius:10,padding:"6px 11px",fontSize:12,fontWeight:800,color:C.pink1,cursor:"pointer"}}>🌸 종목 추가</button></>}
              {tab==="memo"&&<><button onClick={exportJSON} style={hBtn}>📥 JSON</button><button onClick={()=>fileRef.current.click()} style={hBtn}>📂 불러오기</button><button onClick={()=>setMemoModal({memo:null})} style={{background:C.card,border:"none",borderRadius:10,padding:"6px 11px",fontSize:12,fontWeight:800,color:"#b06040",cursor:"pointer"}}>📓 메모 추가</button><button onClick={logout} style={{...hBtn,fontSize:11}}>로그아웃</button></>}
              {tab==="ai"&&<><button onClick={exportJSON} style={hBtn}>📥 JSON</button><button onClick={()=>fileRef.current.click()} style={hBtn}>📂 불러오기</button></>}
            </div>
          </div>
          {tab!=="memo"&&tab!=="ipo"&&tab!=="ai"&&<div style={{position:"relative"}}><span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",fontSize:14}}>🔍</span><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="테마, 종목, 이유 검색..." style={{width:"100%",borderRadius:12,padding:"9px 36px",fontSize:13,border:"none",outline:"none",background:"rgba(255,255,255,0.75)",color:C.text,boxSizing:"border-box"}}/>{search&&<button onClick={()=>setSearch("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:16,color:C.pink1}}>✕</button>}</div>}
        </div>
      </div>

      <div style={{maxWidth:672,margin:"0 auto",padding:"14px 12px 0",display:"flex",flexDirection:"column",gap:10}}>
        {showPending&&tab==="home"&&<div style={{background:C.yellow2,borderRadius:16,border:`1.5px solid #e0c040`,padding:16}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}><span>🔔</span><span style={{fontWeight:800,fontSize:14,color:"#b09020"}}>사후관리 미입력</span><span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:"#e8d840",color:"#7a6000",fontWeight:700}}>{pending.length}건</span></div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>{pending.map(rec=><div key={rec.id} style={{background:C.card,borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,border:`1px solid ${C.border}`}}><div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}><span style={{fontSize:12,fontWeight:700,color:C.pink1}}>{fmtDate(rec.date)}</span><span style={{fontSize:13,fontWeight:700,color:C.text}}>{rec.stock}</span>{rec.d1Change==null&&<span style={{fontSize:11,padding:"2px 6px",borderRadius:6,background:C.coral2,color:"#b06040",fontWeight:600}}>D+1</span>}{rec.d2Change==null&&<span style={{fontSize:11,padding:"2px 6px",borderRadius:6,background:C.coral2,color:"#b06040",fontWeight:600}}>D+2</span>}</div><button onClick={()=>setModal({type:"editKR",record:rec})} style={{flexShrink:0,padding:"6px 12px",borderRadius:10,border:`1.5px solid ${C.border}`,background:C.card,fontSize:12,fontWeight:700,color:C.pink1,cursor:"pointer"}}>입력하기</button></div>)}</div>
        </div>}

        {tab==="home"&&(krGroups.length===0?<div style={{textAlign:"center",padding:"64px 0"}}><div style={{fontSize:48,marginBottom:8}}>🌸</div><p style={{fontWeight:700,color:C.sub}}>기록이 없어요</p></div>:krGroups.map(([theme,recs])=>{
          const isOpen=!!openThemes[theme]; const latestDate=recs.reduce((a,b)=>a>b.date?a:b.date,""); const dPlus=daysDiff(latestDate); const avgC=(recs.reduce((s,r)=>s+(r.change||0),0)/recs.length).toFixed(2); const leader=leaders[theme];
          const stockMap={}; recs.forEach(r=>{if(!stockMap[r.stock])stockMap[r.stock]=[];stockMap[r.stock].push(r);});
          const sortedS=Object.entries(stockMap).sort(([,a],[,b])=>{const la=a.reduce((m,r)=>r.date>m?r.date:m,"");const lb=b.reduce((m,r)=>r.date>m?r.date:m,"");return lb.localeCompare(la);});
          return (
            <div key={theme} style={{background:C.card,borderRadius:18,overflow:"hidden",border:`1px solid ${C.border}`,boxShadow:`0 2px 10px ${C.pink1}20`}}>
              <button onClick={()=>setOpenThemes(p=>({...p,[theme]:!p[theme]}))} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 16px",background:C.card,border:"none",cursor:"pointer"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",minWidth:0}}>
                  <span onClick={e=>{e.stopPropagation();setEmojiTarget(theme);}} style={{fontSize:15,cursor:"pointer",borderRadius:6,padding:"2px 4px"}}>{getThemeIcon(theme,ci)}</span>
                  <span style={{fontWeight:800,fontSize:14,color:C.text}}>{theme}</span>
                  <span style={{fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:20,background:Number(avgC)>=0?C.pink2:C.blue2,color:Number(avgC)>=0?"#c0607a":"#4a7ab5"}}>{Number(avgC)>=0?"+":""}{avgC}%</span>
                  <span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:C.pink3,color:C.pink1,fontWeight:700}}>{recs.length}건</span>
                  <button onClick={e=>{e.stopPropagation();setLeaderModal({theme,stocks:[...new Set(recs.map(r=>r.stock))]});}} style={{display:"flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:20,background:leader?C.yellow2:C.pink3,border:`1px solid ${leader?"#e0c040":C.border}`,cursor:"pointer",fontSize:11,fontWeight:700,color:leader?"#b09020":C.sub}}>👑 {leader||"대장주 설정"}</button>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0,marginLeft:8}}>
                  <div style={{textAlign:"right"}}><div style={{fontSize:11,color:C.sub}}>{fmtDate(latestDate)}</div><div style={{fontSize:11,fontWeight:700,color:C.pink1}}>D+{dPlus}</div></div>
                  <span style={{fontSize:14,color:C.pink1}}>{isOpen?"▲":"▼"}</span>
                </div>
              </button>
              {isOpen&&sortedS.map(([stock,sRecs])=>{
                const key=`${theme}_${stock}`; const isFav=favorites.has(stock); const isLeader=leader===stock; const hasPending=sRecs.some(r=>r.d1Change==null||r.d2Change==null); const avgSC=(sRecs.reduce((s,r)=>s+(r.change||0),0)/sRecs.length).toFixed(2); const latest=sRecs.reduce((a,b)=>a.date>b.date?a:b); const mc=latest.marketCap>=10000?`${(latest.marketCap/10000).toFixed(0)}조`:`${(latest.marketCap||0).toLocaleString()}억`; const otherT=[...new Set(krRecords.filter(r=>r.stock===stock).flatMap(r=>getThemes(r)))].filter(t=>t!==theme);
                return (
                  <div key={key} style={{borderTop:`1px solid ${C.border}`,background:C.bg}}>
                    <div style={{padding:"12px 16px",display:"flex",flexDirection:"column",gap:8}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                        {isLeader&&<span>👑</span>}
                        <span style={{fontWeight:700,fontSize:14,color:C.text}}>{stock}</span>
                        <span style={{fontSize:11,padding:"2px 7px",borderRadius:8,background:C.card,color:"#424242",fontWeight:600,border:`1px solid ${C.border}`}}>{mc}</span>
                        <span style={{fontSize:12,fontWeight:700,color:Number(avgSC)>=0?"#c0607a":"#4a7ab5"}}>{Number(avgSC)>=0?"+":""}{avgSC}%</span>
                        {otherT.length>0&&<span style={{fontSize:11,color:"#8060a0",background:"#f0e8f8",padding:"2px 7px",borderRadius:20,fontWeight:700}}>📚 {otherT.join(", ")}</span>}
                        {hasPending&&<span style={{fontSize:11,color:"#b06040",background:C.coral2,padding:"2px 6px",borderRadius:20}}>🔔</span>}
                        <button onClick={()=>toggleFav(stock)} style={{marginLeft:"auto",padding:4,background:"none",border:"none",cursor:"pointer",fontSize:15}}>{isFav?"⭐":"☆"}</button>
                      </div>
                      <div style={{display:"flex",flexDirection:"column",gap:6,paddingLeft:8,borderLeft:`2px solid ${C.border}`}}>
                        {[...sRecs].sort((a,b)=>b.date.localeCompare(a.date)).map(rec=>{
                          const rKey=`${key}_${rec.id}`; const isRO=!!openStocks[rKey];
                          return (
                            <div key={rec.id}>
                              <div onClick={()=>setOpenStocks(p=>({...p,[rKey]:!p[rKey]}))} style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",padding:"4px 0"}}>
                                <div style={{width:8,height:8,background:C.pink1,borderRadius:"50%",flexShrink:0,marginLeft:-13}}/>
                                <span style={{fontSize:12,fontWeight:700,color:C.pink1,minWidth:72}}>{fmtDate(rec.date)}</span>
                                <span style={{fontSize:11,fontWeight:700,padding:"2px 7px",borderRadius:20,background:(rec.change||0)>=0?C.pink2:C.blue2,color:(rec.change||0)>=0?"#c0607a":"#4a7ab5"}}>{(rec.change||0)>=0?"+":""}{rec.change}%</span>
                                {getThemes(rec).filter(t=>t!==theme).map(t=><span key={t} style={{fontSize:10,padding:"1px 6px",borderRadius:8,background:"#f0e8f8",color:"#8060a0"}}>{getThemeIcon(t,ci)}{t}</span>)}
                                <div style={{marginLeft:"auto",display:"flex",gap:4,alignItems:"center"}}>
                                  <button onClick={e=>{e.stopPropagation();setModal({type:"editKR",record:rec});}} style={{padding:3,background:"none",border:"none",cursor:"pointer",fontSize:13}}>✏️</button>
                                  <button onClick={e=>{e.stopPropagation();setDelModal({id:rec.id,type:"kr",msg:`${rec.date} ${rec.stock} 기록을 삭제합니다.`});}} style={{padding:3,background:"none",border:"none",cursor:"pointer",fontSize:13}}>🗑️</button>
                                  <span style={{fontSize:11,color:C.pink1}}>{isRO?"▲":"▼"}</span>
                                </div>
                              </div>
                              {isRO&&<div style={{background:C.card,borderRadius:12,padding:"10px 12px",margin:"4px 0 4px 4px",border:`1px solid ${C.border}`}}><KRDetail rec={rec} q={q}/></div>}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          );
        }))}

        {tab==="us"&&<>
          {upcomingE.length>0&&<div style={{background:C.yellow2,borderRadius:16,padding:"12px 14px",border:`1.5px solid #e0c040`}}>
            <p style={{fontSize:14,fontWeight:800,color:C.usMid,margin:"0 0 10px"}}>📅 다가오는 실적발표</p>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {(earningsExp?upcomingE:upcomingE.slice(0,3)).map(c=>{
                const d=c.dday,isPast=d<0,isToday=d===0,isUrgent=d<=3&&d>=0;
                return (<div key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",background:isPast?"#f5f5f5":isToday?C.coral2:isUrgent?C.yellow2:C.card,borderRadius:10,border:`1px solid ${isToday?"#e0a040":isUrgent?"#e0c040":C.usLight}`}}><span style={{fontSize:12,fontWeight:800,color:isPast?"#aaa":isToday?"#b06040":isUrgent?"#b09020":C.usMid,minWidth:44}}>{isPast?`D+${Math.abs(d)}`:isToday?"D-day":`D-${d}`}</span><span style={{fontWeight:700,fontSize:13,color:isPast?"#aaa":C.usBlue}}>{c.stock}</span><span style={{fontSize:11,fontWeight:700,padding:"1px 7px",borderRadius:6,background:isPast?"#eee":C.usLight,color:isPast?"#aaa":C.usMid}}>{c.ticker}</span><span style={{fontSize:11,color:"#aaa",marginLeft:"auto"}}>{fmtDate(c.earningsDate)}</span></div>);
              })}
            </div>
            {upcomingE.length>3&&<button onClick={()=>setEarningsExp(p=>!p)} style={{marginTop:8,width:"100%",background:"none",border:"none",cursor:"pointer",fontSize:12,fontWeight:700,color:C.usMid,padding:"4px 0"}}>{earningsExp?"▲ 접기":`▼ ${upcomingE.length-3}개 더 보기`}</button>}
          </div>}

                        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6}}>

                            :<button onClick={e=>{e.stopPropagation();setBuyModal(stock);}} style={{padding:"4px 10px",borderRadius:9,border:"none",background:"linear-gradient(135deg,#2a9d8f,#1a7a6e)",color:"white",fontWeight:700,fontSize:11,cursor:"pointer"}}>🛒 매수</button>

                          <button onClick={()=>toggleFav(stock)} style={{padding:4,background:"none",border:"none",cursor:"pointer",fontSize:15}}>⭐</button>
                        </div>
                      </div>
                      {getHolding(stock)&&<div style={{display:"flex",alignItems:"center",gap:8,padding:"5px 10px",background:"#e8faf4",borderRadius:8,border:"1px solid #a8e6cf"}}>

                        <span style={{fontSize:11,color:"#b08898",fontWeight:600}}>{getHolding(stock).buy_date.replace(/-/g,".")} 매수</span>

                      </div>}
                      <div style={{display:"flex",flexDirection:"column",gap:4,paddingLeft:8,borderLeft:`2px solid ${C.border}`}}>
                        {sRecs.map(rec=>{

                          return (
                            <div key={rec.id}>
                              <div onClick={()=>setOpenStocks(p=>({...p,[rKey]:!p[rKey]}))} style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",padding:"3px 0"}}>
                                <div style={{width:8,height:8,background:C.pink1,borderRadius:"50%",flexShrink:0,marginLeft:-13}}/>
                                <span style={{fontSize:12,fontWeight:700,color:C.pink1,minWidth:72}}>{fmtDate(rec.date)}</span>
                                <span style={{fontSize:11,fontWeight:700,padding:"2px 7px",borderRadius:20,background:(rec.change||0)>=0?C.pink2:C.blue2,color:(rec.change||0)>=0?"#c0607a":"#4a7ab5"}}>{(rec.change||0)>=0?"+":""}{rec.change}%</span>

              <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:16}}>🇺🇸</span><span style={{fontWeight:800,fontSize:14,color:C.usBlue}}>미국주식</span><span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:C.usLight,color:C.usMid,fontWeight:700}}>{usCards.filter(c=>favorites.has(c.stock)).length}종목</span></div>

                    return (

                                {vsT!=null&&<span style={{fontSize:11,padding:"2px 7px",borderRadius:8,background:Number(vsT)>=0?C.mint2:C.red2,color:Number(vsT)>=0?"#2a9d8f":"#c0392b",fontWeight:700}}>목표 {Number(vsT)>=0?"+":""}{vsT}%</span>}

        </>}

        {tab==="ai"&&<AIAnalysisTab krRecords={krRecords} usCards={usCards} ipoRecords={ipoRecords} principle={principle}/>}

        {tab==="memo"&&<>
          <div style={{background:C.yellow2,borderRadius:18,border:`1.5px solid #e0c040`}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 16px 10px"}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}><span>📌</span><span style={{fontWeight:800,fontSize:14,color:C.text}}>매수 · 매도 원칙</span><span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:"#e8d840",color:"#7a6000"}}>고정</span></div>
              {!editP?<button onClick={()=>{setPForm(principle);setEditP(true);}} style={{fontSize:12,fontWeight:700,color:"#b09020",background:"none",border:"none",cursor:"pointer"}}>✏️ 편집</button>:<div style={{display:"flex",gap:8}}><button onClick={()=>setEditP(false)} style={{fontSize:12,color:C.sub,background:"none",border:"none",cursor:"pointer"}}>취소</button><button onClick={saveP} style={{fontSize:12,fontWeight:700,color:C.pink1,background:"none",border:"none",cursor:"pointer"}}>저장</button></div>}

              <div><p style={{fontSize:11,fontWeight:700,color:"#4a7ab5",margin:"0 0 5px"}}>📉 매도 원칙</p>{editP?<textarea value={pForm.sell} onChange={e=>setPForm(f=>({...f,sell:e.target.value}))} rows={4} style={{...iBase,background:"rgba(255,255,255,0.7)",border:`1.5px solid #e0c040`,resize:"none"}}/>:<p style={{fontSize:13,color:principle.sell?C.text:C.sub,background:"rgba(255,255,255,0.6)",borderRadius:10,padding:"10px 14px",margin:0,lineHeight:1.75,whiteSpace:"pre-wrap",minHeight:48}}>{principle.sell||"아직 원칙이 없어요 ✏️"}</p>}</div>
            </div>
          </div>
          {memos.length===0&&<div style={{textAlign:"center",padding:"48px 0"}}><div style={{fontSize:40,marginBottom:8}}>📓</div><p style={{fontWeight:700,color:C.sub}}>아직 메모가 없어요</p></div>}
          {[...memos].sort((a,b)=>b.id.localeCompare(a.id)).map(memo=>(
            <div key={memo.id} style={{background:C.card,borderRadius:16,padding:16,border:`1px solid ${C.border}`}}>
              <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:8,gap:8}}>
                <div>{memo.title&&<p style={{fontWeight:800,fontSize:14,color:C.text,margin:"0 0 2px"}}>{memo.title}</p>}<p style={{fontSize:11,color:C.sub,margin:0}}>{memo.updatedAt!==memo.createdAt?`수정됨 · ${memo.updatedAt}`:memo.createdAt}</p></div>
                <div style={{display:"flex",gap:4,flexShrink:0}}><button onClick={()=>setMemoModal({memo})} style={{padding:5,background:"none",border:"none",cursor:"pointer",fontSize:14}}>✏️</button><button onClick={()=>setMemoDelModal({id:memo.id,msg:`"${memo.title||memo.content.slice(0,15)}..." 메모를 삭제합니다.`})} style={{padding:5,background:"none",border:"none",cursor:"pointer",fontSize:14}}>🗑️</button></div>
              </div>
              <p style={{fontSize:13,color:C.text,margin:0,lineHeight:1.75,whiteSpace:"pre-wrap"}}>{memo.content}</p>

          ))}

      </div>

      {/* 하단 탭바 */}

        <div style={{maxWidth:672,margin:"0 auto",display:"flex"}}>
          {TABS.map(({id,label,icon,ac,ab})=>(
            <button key={id} onClick={()=>setTab(id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"10px 0 7px",gap:2,background:"none",border:"none",cursor:"pointer",color:tab===id?ac:C.sub}}>
              <div style={{width:36,height:36,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",background:tab===id?ab:"transparent",fontSize:18,position:"relative"}}>

                {id==="memo"&&memos.length>0&&<span style={{position:"absolute",top:-4,right:-4,width:16,height:16,background:"#b06040",color:"white",fontSize:10,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center"}}>{memos.length}</span>}
              </div>
              <span style={{fontSize:10,fontWeight:tab===id?800:600}}>{label}</span>
            </button>
          ))}
        </div>
      </div>

      {(modal?.type==="addKR"||modal?.type==="editKR")&&<KRModal initial={modal.record} allRecords={krRecords} ci={ci} onSetIcon={setIcon} onSave={saveKR} onClose={()=>setModal(null)}/>}
      {(modal?.type==="addUS"||modal?.type==="editUS")&&<USModal initial={modal.card} allCards={usCards} ci={ci} onSetIcon={setIcon} onSave={saveUS} onClose={()=>setModal(null)}/>}
      {delModal&&<DeleteModal msg={delModal.msg} onConfirm={()=>delModal.type==="us"?deleteUS(delModal.id):deleteKR(delModal.id)} onCancel={()=>setDelModal(null)}/>}
      {memoModal!==null&&<MemoModal initial={memoModal.memo} onSave={saveMemo} onClose={()=>setMemoModal(null)}/>}
      {memoDelModal&&<DeleteModal msg={memoDelModal.msg} onConfirm={()=>deleteMemo(memoDelModal.id)} onCancel={()=>setMemoDelModal(null)}/>}
      {emojiTarget&&<EmojiPicker current={ci[emojiTarget]} onSelect={em=>setIcon(emojiTarget,em)} onClose={()=>setEmojiTarget(null)}/>}
      {leaderModal&&<ThemeLeaderModal theme={leaderModal.theme} current={leaders[leaderModal.theme]} stocks={leaderModal.stocks} onSave={saveLeader} onClose={()=>setLeaderModal(null)}/>}
      {buyModal&&<BuyModal stock={buyModal} onSave={info=>{saveHolding(info);setBuyModal(null);}} onClose={()=>setBuyModal(null)}/>}
      {sellModal&&<SellConfirmModal stock={sellModal.stock} holdingInfo={sellModal.holdingInfo} onConfirm={()=>{deleteHolding(sellModal.stock);setSellModal(null);}} onClose={()=>setSellModal(null)}/>}
      {ipoAddRec&&<IpoRecordModal initial={null} onSave={rec=>{setIpoRecordsWrapped(p=>[...p,rec]);setIpoAddRec(false);}} onClose={()=>setIpoAddRec(false)}/>}
      {ipoAddSched&&<IpoScheduleModal initial={null} onSave={s=>{setIpoSchedulesWrapped(p=>[...p,s]);setIpoAddSched(false);}} onClose={()=>setIpoAddSched(false)}/>}
    </div>
  );
}


// ── Firebase 앱 래퍼 ──
function AppWithAuth() {
  const [user, setUser] = React.useState(null);
  const [authLoading, setAuthLoading] = React.useState(true);
  const [loginLoading, setLoginLoading] = React.useState(false);
  const fb = window.__firebase;

  React.useEffect(()=>{
    const unsub = fb.onAuthStateChanged(fb.auth, u=>{setUser(u);setAuthLoading(false);});
    return unsub;
  },[]);

  const login = async()=>{
    setLoginLoading(true);
    try{await fb.signInWithPopup(fb.auth,fb.provider);}catch(e){console.error(e);}
    setLoginLoading(false);
  };

  if(authLoading) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#f9d4e4,#fde8d8)"}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:12,display:"inline-block"}} className="spin">🌸</div>
        <p style={{color:"#3a2535",fontWeight:700}}>불러오는 중...</p>
      </div>
    </div>
  );
  if(!user) return <LoginScreen onLogin={login} loading={loginLoading}/>;
  return <App user={user}/>;
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(AppWithAuth));
</script>
