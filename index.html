// ── 메인 앱 ──
function App({user}) {
  // tradePlan 저장을 위해 현재 유저 전역 노출
  React.useEffect(()=>{ window.__currentUser = user; return()=>{ window.__currentUser = null; }; }, [user]);
  const fb = window.__firebase;
  const [, forceUpdate] = React.useReducer(x=>x+1, 0);
  React.useEffect(()=>{
    const vv = window.visualViewport;
    if(!vv) return;
    const handler = () => forceUpdate();
    vv.addEventListener("resize", handler);
    vv.addEventListener("scroll", handler);
    return () => { vv.removeEventListener("resize", handler); vv.removeEventListener("scroll", handler); };
  }, []);
  const [krRecords,setKrRecords] = useState([]);
  const [usCards,setUsCards] = useState([]);
  const [memos,setMemos] = useState([]);
  const [principle,setPrinciple] = useState({buy:"",sell:""});
  const [ipoRecords,setIpoRecords] = useState([]);
  const [ipoSchedules,setIpoSchedules] = useState([]);
  const [tab,setTab] = useState("home");
  const [search,setSearch] = useState("");
  const [openThemes,setOpenThemes] = useState({});
  const [openStocks,setOpenStocks] = useState({});
  const [favorites,setFavorites] = useState([]);
  const [ci,setCi] = useState({});
  const [leaders,setLeaders] = useState({});
  const [modal,setModal] = useState(null);
  const [delModal,setDelModal] = useState(null);
  const [memoModal,setMemoModal] = useState(null);
  const [memoDelModal,setMemoDelModal] = useState(null);
  const [showPending,setShowPending] = useState(false);
  const [emojiTarget,setEmojiTarget] = useState(null);
  const [leaderModal,setLeaderModal] = useState(null);
  const [earningsExp,setEarningsExp] = useState(false);
  const [holdings,setHoldings] = useState([]);
  const [favKROpen,setFavKROpen] = useState(true);
  const [favUSOpen,setFavUSOpen] = useState(true);
  const [editP,setEditP] = useState(false);
  const [pForm,setPForm] = useState({buy:"",sell:""});
  const [ipoAddRec,setIpoAddRec] = useState(false);
  const [buyModal,setBuyModal] = useState(null);
  const [sellModal,setSellModal] = useState(null);
  const [themeRenameFrom,setThemeRenameFrom] = useState("");
  const [themeRenameTo,setThemeRenameTo] = useState("");
  const [ipoAddSched,setIpoAddSched] = useState(false);
  const fileRef = useRef();

  const [saving, setSaving] = React.useState(false);

  // Firebase 실시간 리스너
  React.useEffect(()=>{
    if(!user) return;
    const uid = user.uid;
    const unsubKR = fb.onSnapshot(fb.collection(fb.db,`users/${uid}/krRecords`),snap=>{setKrRecords(snap.docs.map(d=>d.data()));});
    const unsubUS = fb.onSnapshot(fb.collection(fb.db,`users/${uid}/usCards`),snap=>{setUsCards(snap.docs.map(d=>d.data()));});
    const unsubMemos = fb.onSnapshot(fb.collection(fb.db,`users/${uid}/memos`),snap=>{setMemos(snap.docs.map(d=>d.data()));});
    const unsubIPORec = fb.onSnapshot(fb.collection(fb.db,`users/${uid}/ipoRecords`),snap=>{setIpoRecords(snap.docs.map(d=>d.data()));});
    const unsubIPOSched = fb.onSnapshot(fb.collection(fb.db,`users/${uid}/ipoSchedules`),snap=>{setIpoSchedules(snap.docs.map(d=>d.data()));});
    const unsubMeta = fb.onSnapshot(fb.doc(fb.db,`users/${uid}/meta/main`),snap=>{
      if(snap.exists()){
        const d=snap.data();
        if(d.principle) setPrinciple(d.principle);
        if(d.favorites) setFavorites(d.favorites); // cleanFavs는 useEffect로 처리
        if(d.customIcons) setCi(d.customIcons);
        if(d.themeLeaders) setLeaders(d.themeLeaders);
        if(d.holdings) setHoldings(d.holdings);
      }
    });
    return()=>{unsubKR();unsubUS();unsubMemos();unsubIPORec();unsubIPOSched();unsubMeta();};
  },[user]);

  const saveMeta = async(data)=>{
    if(!user) return; setSaving(true);
    try{await fb.setDoc(fb.doc(fb.db,`users/${user.uid}/meta/main`),data,{merge:true});}catch(e){console.error(e);}
    setSaving(false);
  };

  // favorites 자동 정리: krRecords/usCards 변화 시 실행
  React.useEffect(()=>{
    if(!user || favorites.length === 0) return;
    const allStocks = new Set([...krRecords.map(r=>r.stock), ...usCards.map(c=>c.stock)]);
    const next = favorites.filter(f=>{const n=typeof f==="object"?f.name:f; return allStocks.has(n);});
    if(next.length !== favorites.length){
      setFavorites(next);
      fb.setDoc(fb.doc(fb.db,`users/${user.uid}/meta/main`),{favorites:next},{merge:true}).catch(console.error);
    }
  },[krRecords, usCards]);

  const logout = async()=>{
    await fb.signOut(fb.auth);
    setKrRecords([]);setUsCards([]);setMemos([]);setIpoRecords([]);setIpoSchedules([]);setFavorites([]);
  };


  const addFav = (stock, code="") => { if(favHas(favorites,stock))return; const next=[...favorites,{name:stock,code}]; setFavorites(next); saveMeta({favorites:next}); };
  const removeFav = (stock) => { const next=favorites.filter(f=>(typeof f==="object"?f.name:f)!==stock); setFavorites(next); saveMeta({favorites:next}); };
  const toggleFav = (stock, code="") => { favHas(favorites,stock)?removeFav(stock):addFav(stock,code); };
  const cleanFavs = (krs, uss) => {
    const allStocks = new Set([...krs.map(r=>r.stock), ...uss.map(c=>c.stock)]);
    const next = favorites.filter(f=>{const n=typeof f==="object"?f.name:f; return allStocks.has(n);});
    if(next.length !== favorites.length){ setFavorites(next); saveMeta({favorites:next}); }
  };
  const saveHolding = (info) => { const next=[...holdings.filter(h=>h.stock!==info.stock),info]; setHoldings(next); saveMeta({holdings:next}); };
  const deleteHolding = (stock) => { const next=holdings.filter(h=>h.stock!==stock); setHoldings(next); saveMeta({holdings:next}); };
  const getHolding = (stock) => holdings.find(h=>h.stock===stock);
  const daysSince = (d) => { if(!d)return 0; const a=new Date(d),b=new Date(); a.setHours(0,0,0,0);b.setHours(0,0,0,0); return Math.floor((b-a)/86400000); };
  const setIcon = (t,e) => { const next={...ci,[t]:e}; setCi(next); saveMeta({customIcons:next}); };
  const saveLeader = (t,s) => { const next={...leaders,[t]:s}; setLeaders(next); saveMeta({themeLeaders:next}); setLeaderModal(null); };
  const saveKR = async(rec)=>{if(!user)return;setSaving(true);try{await fb.setDoc(fb.doc(fb.db,`users/${user.uid}/krRecords/${rec.id}`),rec);}catch(e){console.error(e);}setSaving(false);setModal(null);};
  const deleteKR = async(id)=>{
    if(!user)return;
    const rec=krRecords.find(r=>r.id===id);
    try{await fb.deleteDoc(fb.doc(fb.db,`users/${user.uid}/krRecords/${id}`));}catch(e){console.error(e);}
    if(rec){
      const remaining=krRecords.filter(r=>r.id!==id&&r.stock===rec.stock);
      if(remaining.length===0&&!usCards.some(c=>c.stock===rec.stock)) removeFav(rec.stock);
    }
    setDelModal(null);
  };
  const saveUS = async(card)=>{if(!user)return;setSaving(true);try{await fb.setDoc(fb.doc(fb.db,`users/${user.uid}/usCards/${card.id}`),card);}catch(e){console.error(e);}setSaving(false);setModal(null);};
  const deleteUS = async(id)=>{
    if(!user)return;
    const card=usCards.find(c=>c.id===id);
    try{await fb.deleteDoc(fb.doc(fb.db,`users/${user.uid}/usCards/${id}`));}catch(e){console.error(e);}
    if(card){
      if(!krRecords.some(r=>r.stock===card.stock)) removeFav(card.stock);
    }
    setDelModal(null);
  };
  const saveMemo = async(memo)=>{if(!user)return;setSaving(true);try{await fb.setDoc(fb.doc(fb.db,`users/${user.uid}/memos/${memo.id}`),memo);}catch(e){console.error(e);}setSaving(false);setMemoModal(null);};
  const deleteMemo = async(id)=>{if(!user)return;try{await fb.deleteDoc(fb.doc(fb.db,`users/${user.uid}/memos/${id}`));}catch(e){console.error(e);}setMemoDelModal(null);};
  const saveP = () => { setPrinciple(pForm); saveMeta({principle:pForm}); setEditP(false); };

  const handleThemeRename = async() => {
    const from = themeRenameFrom.trim();
    const to = themeRenameTo.trim();
    if(!from||!to||!user) return;
    const batch = fb.writeBatch(fb.db);
    let count = 0;
    krRecords.forEach(rec => {
      if(rec.themes && rec.themes.includes(from)) {
        const newThemes = rec.themes.map(t=>t===from?to:t);
        const newTheme = rec.theme===from?to:rec.theme;
        batch.set(fb.doc(fb.db,`users/${user.uid}/krRecords/${rec.id}`),{...rec,themes:newThemes,theme:newTheme});
        count++;
      }
    });
    if(count===0){alert(`"${from}" 테마를 찾을 수 없어요`);return;}
    await batch.commit();
    // customIcons도 업데이트
    if(ci[from]){
      const newCi={...ci,[to]:ci[from]};
      delete newCi[from];
      setCi(newCi);
      saveMeta({customIcons:newCi});
    }
    setThemeRenameFrom("");
    setThemeRenameTo("");
    alert(`✅ "${from}" → "${to}" ${count}개 종목에 반영됐어요!`);
  };

  // IPO Firebase wrappers
  const saveIpoRec = async(rec)=>{if(!user)return;setSaving(true);try{await fb.setDoc(fb.doc(fb.db,`users/${user.uid}/ipoRecords/${rec.id}`),rec);}catch(e){console.error(e);}setSaving(false);};
  const deleteIpoRec = async(id)=>{if(!user)return;try{await fb.deleteDoc(fb.doc(fb.db,`users/${user.uid}/ipoRecords/${id}`));}catch(e){console.error(e);}};
  const saveIpoSched = async(s)=>{if(!user)return;setSaving(true);try{await fb.setDoc(fb.doc(fb.db,`users/${user.uid}/ipoSchedules/${s.id}`),s);}catch(e){console.error(e);}setSaving(false);};
  const deleteIpoSched = async(id)=>{if(!user)return;try{await fb.deleteDoc(fb.doc(fb.db,`users/${user.uid}/ipoSchedules/${id}`));}catch(e){console.error(e);}};
  const setIpoRecordsWrapped=(updater)=>{const next=typeof updater==="function"?updater(ipoRecords):updater;next.forEach(rec=>{const ex=ipoRecords.find(r=>r.id===rec.id);if(!ex||JSON.stringify(ex)!==JSON.stringify(rec))saveIpoRec(rec);});ipoRecords.forEach(rec=>{if(!next.find(r=>r.id===rec.id))deleteIpoRec(rec.id);});};
  const setIpoSchedulesWrapped=(updater)=>{const next=typeof updater==="function"?updater(ipoSchedules):updater;next.forEach(s=>{const ex=ipoSchedules.find(x=>x.id===s.id);if(!ex||JSON.stringify(ex)!==JSON.stringify(s))saveIpoSched(s);});ipoSchedules.forEach(s=>{if(!next.find(x=>x.id===s.id))deleteIpoSched(s.id);});};

  const exportJSON = () => {
    const data = {krRecords,usCards,memos,ipoRecords,ipoSchedules,favorites:favorites,principle,customIcons:ci,themeLeaders:leaders};
    const url = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
    const a = document.createElement("a"); a.href=url; a.download="seohyun_note.json"; a.click(); URL.revokeObjectURL(url);
  };
  const importJSON = (e) => {
    const file = e.target.files[0]; if(!file)return;
    const reader = new FileReader();
    reader.onload = async ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if(!user) return; setSaving(true);
        const uid = user.uid;
        const batch = fb.writeBatch(fb.db);
        (d.krRecords||[]).forEach(rec=>batch.set(fb.doc(fb.db,`users/${uid}/krRecords/${rec.id}`),rec));
        (d.usCards||[]).forEach(card=>batch.set(fb.doc(fb.db,`users/${uid}/usCards/${card.id}`),card));
        (d.memos||[]).forEach(memo=>batch.set(fb.doc(fb.db,`users/${uid}/memos/${memo.id}`),memo));
        (d.ipoRecords||[]).forEach(rec=>batch.set(fb.doc(fb.db,`users/${uid}/ipoRecords/${rec.id}`),rec));
        (d.ipoSchedules||[]).forEach(s=>batch.set(fb.doc(fb.db,`users/${uid}/ipoSchedules/${s.id}`),s));
        await batch.commit();
        await fb.setDoc(fb.doc(fb.db,`users/${uid}/meta/main`),{favorites:[...(new Set(d.favorites||[]))],principle:d.principle||{buy:"",sell:""},customIcons:d.customIcons||{},themeLeaders:d.themeLeaders||{}},{merge:true});
        setSaving(false);
        alert("불러오기 완료! ✅");
      } catch(err) { console.error(err); alert("JSON 파일을 읽을 수 없어요 🥺"); }
      e.target.value = "";
    };
    reader.readAsText(file);
  };

  const exportKRCSV = () => {
    const BOM="\uFEFF", h="날짜,테마,종목명,시가총액(억),상승률(%),거래대금(백만),거래대금평균(백만),기관수급,외인수급,52주고점比,D+1,D+2,기업설명,상승이유\n";
    const rows = krRecords.map(r=>[r.date,getThemes(r).join("|"),r.stock,r.marketCap,r.change,r.tradingAmt||"",r.tradingAmt20||"",r.instFlow?(r.instFlowType+r.instFlow):"",r.foreignFlow?(r.foreignFlowType+r.foreignFlow):"",(r.high52wPct??""),(r.d1Change??""),(r.d2Change??""),`"${(r.desc||"").replace(/"/g,'""')}"`,`"${(r.reason||"").replace(/"/g,'""')}"`].join(",")).join("\n");
    const url=URL.createObjectURL(new Blob([BOM+h+rows],{type:"text/csv;charset=utf-8;"}));
    const a=document.createElement("a"); a.href=url; a.download="seohyun_kr.csv"; a.click(); URL.revokeObjectURL(url);
  };
  const exportUSCSV = () => {
    const BOM="\uFEFF", h="등록일,테마,종목명,티커,시총(USD),관심이유,실적발표일,현재가,52주고점,52주저점,목표주가,종료이유\n";
    const rows = usCards.map(c=>[c.addedDate,getThemes(c).join("|"),c.stock,c.ticker||"",c.marketCapUSD||"",`"${(c.reason||"").replace(/"/g,'""')}"`,c.earningsDate||"",c.currentPrice||"",c.high52w||"",c.low52w||"",c.targetPrice||"",`"${(c.closedReason||"").replace(/"/g,'""')}"`].join(",")).join("\n");
    const url=URL.createObjectURL(new Blob([BOM+h+rows],{type:"text/csv;charset=utf-8;"}));
    const a=document.createElement("a"); a.href=url; a.download="seohyun_us.csv"; a.click(); URL.revokeObjectURL(url);
  };
  const exportIPOCSV = () => {
    const BOM="\uFEFF", h="종목명,증권사,청약수량,배정수량,공모가,상장일,매도가,매도일,메모\n";
    const rows = ipoRecords.map(r=>[r.name,r.broker,r.subscribeQty||"",r.allocatedQty,r.ipoPrice,r.listingDate||"",r.sellPrice||"",r.sellDate||"",`"${(r.memo||"").replace(/"/g,'""')}"`].join(",")).join("\n");
    const url=URL.createObjectURL(new Blob([BOM+h+rows],{type:"text/csv;charset=utf-8;"}));
    const a=document.createElement("a"); a.href=url; a.download="seohyun_ipo.csv"; a.click(); URL.revokeObjectURL(url);
  };

  const q = search.trim().toLowerCase();
  const filteredKR = useMemo(()=>q?krRecords.filter(r=>[...getThemes(r),r.stock,r.desc,r.reason].some(v=>String(v||"").toLowerCase().includes(q))):krRecords,[krRecords,q]);
  const filteredUS = useMemo(()=>q?usCards.filter(c=>[...getThemes(c),c.stock,c.ticker,c.reason,...(c.news||[]).map(n=>n.content)].some(v=>String(v||"").toLowerCase().includes(q))):usCards,[usCards,q]);
  const krGroups = useMemo(()=>{const map={};filteredKR.forEach(r=>getThemes(r).forEach(t=>{if(!map[t])map[t]=[];map[t].push(r);}));return Object.entries(map).sort(([,a],[,b])=>new Date(Math.max(...b.map(r=>new Date(r.date))))-new Date(Math.max(...a.map(r=>new Date(r.date)))));},[filteredKR]);
  const sortedUS = useMemo(()=>{const td=todayISO();return[...filteredUS].sort((a,b)=>{const ac=!!a.closedReason,bc=!!b.closedReason;if(ac!==bc)return ac?1:-1;if(!a.earningsDate&&!b.earningsDate)return 0;if(!a.earningsDate)return 1;if(!b.earningsDate)return -1;const aF=a.earningsDate>=td,bF=b.earningsDate>=td;if(aF&&bF)return a.earningsDate.localeCompare(b.earningsDate);if(!aF&&!bF)return b.earningsDate.localeCompare(a.earningsDate);return aF?-1:1;});},[filteredUS]);
  const pending = useMemo(()=>krRecords.filter(r=>r.d1Change==null||r.d2Change==null),[krRecords]);
  const upcomingE = useMemo(()=>usCards.filter(c=>!c.closedReason&&c.earningsDate).map(c=>({...c,dday:daysDiff(c.earningsDate)*-1})).filter(c=>c.dday>=-7).sort((a,b)=>a.dday-b.dday),[usCards]);

  const hBtn = {background:"rgba(255,255,255,0.5)",border:"1px solid rgba(255,255,255,0.7)",borderRadius:10,padding:"6px 11px",fontSize:12,fontWeight:700,color:C.text,cursor:"pointer"};

  const TABS = [
    {id:"home",label:"국내주식",icon:"🇰🇷",ac:C.pink1,ab:C.pink3},
    {id:"us",label:"미국주식",icon:"🇺🇸",ac:"#4a7ab5",ab:C.usLight},
    {id:"ipo",label:"공모주",icon:"🌸",ac:"#c0607a",ab:C.pink2},
    {id:"fav",label:"관심종목",icon:"🌿",ac:"#2a9d8f",ab:C.mint2},
    {id:"ai",label:"AI분석",icon:"🤖",ac:"#7b2ff7",ab:"#f0e8ff"},
    {id:"memo",label:"메모",icon:"📓",ac:"#b06040",ab:C.coral2},
  ];

  return (
    <div style={{fontFamily:"'Pretendard','Apple SD Gothic Neo',sans-serif",background:C.bg,minHeight:"100vh",paddingBottom:80}}>
      <input ref={fileRef} type="file" accept=".json" onChange={importJSON} style={{display:"none"}}/>

      <div style={{background:`linear-gradient(135deg,${C.pink2},${C.coral2})`,padding:"24px 16px 16px",boxShadow:`0 2px 16px ${C.pink1}30`}}>
        <div style={{maxWidth:672,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:40,height:40,borderRadius:14,background:"rgba(255,255,255,0.6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>🌸</div>
              <div><div style={{fontWeight:900,fontSize:17,color:C.text}}>Seohyun's Note</div><div style={{fontSize:11,color:C.text,opacity:.65}}>{user?.displayName||"서현"} · {saving?"저장 중...":"동기화됨 ✓"}</div></div>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {tab==="home"&&<><button onClick={exportKRCSV} style={hBtn}>📥 CSV</button>{pending.length>0&&<button onClick={()=>setShowPending(p=>!p)} style={{...hBtn,background:showPending?"rgba(247,196,168,0.8)":"rgba(255,255,255,0.5)",color:showPending?"#b06040":C.text}}>🔔 {pending.length}건</button>}<button onClick={()=>setModal({type:"addKR"})} style={{background:C.card,border:"none",borderRadius:10,padding:"6px 11px",fontSize:12,fontWeight:800,color:C.pink1,cursor:"pointer"}}>🌸 기록 추가</button></>}
              {tab==="us"&&<><button onClick={exportUSCSV} style={hBtn}>📥 CSV</button><button onClick={()=>setModal({type:"addUS"})} style={{background:C.card,border:"none",borderRadius:10,padding:"6px 11px",fontSize:12,fontWeight:800,color:C.usMid,cursor:"pointer"}}>🌊 기록 추가</button></>}
              {tab==="ipo"&&<><button onClick={exportIPOCSV} style={hBtn}>📥 CSV</button><button onClick={()=>setIpoAddSched(true)} style={{background:"rgba(255,255,255,0.7)",border:"none",borderRadius:10,padding:"6px 11px",fontSize:12,fontWeight:800,color:C.usMid,cursor:"pointer"}}>📌 일정 추가</button><button onClick={()=>setIpoAddRec(true)} style={{background:C.card,border:"none",borderRadius:10,padding:"6px 11px",fontSize:12,fontWeight:800,color:C.pink1,cursor:"pointer"}}>🌸 종목 추가</button></>}
              {tab==="memo"&&<><button onClick={exportJSON} style={hBtn}>📥 JSON</button><button onClick={()=>fileRef.current.click()} style={hBtn}>📂 불러오기</button><button onClick={()=>setMemoModal({memo:null})} style={{background:C.card,border:"none",borderRadius:10,padding:"6px 11px",fontSize:12,fontWeight:800,color:"#b06040",cursor:"pointer"}}>📓 메모 추가</button><button onClick={logout} style={{...hBtn,fontSize:11}}>로그아웃</button></>}
              {tab==="ai"&&<><button onClick={exportJSON} style={hBtn}>📥 JSON</button><button onClick={()=>fileRef.current.click()} style={hBtn}>📂 불러오기</button></>}
            </div>
          </div>
          {tab!=="memo"&&tab!=="ipo"&&tab!=="ai"&&<div style={{position:"relative"}}><span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",fontSize:14}}>🔍</span><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="테마, 종목, 이유 검색..." style={{width:"100%",borderRadius:12,padding:"9px 36px",fontSize:13,border:"none",outline:"none",background:"rgba(255,255,255,0.75)",color:C.text,boxSizing:"border-box"}}/>{search&&<button onClick={()=>setSearch("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:16,color:C.pink1}}>✕</button>}</div>}
        </div>
      </div>

      <div style={{maxWidth:672,margin:"0 auto",padding:"14px 12px 0",display:"flex",flexDirection:"column",gap:10}}>
        {showPending&&tab==="home"&&<div style={{background:C.yellow2,borderRadius:16,border:`1.5px solid #e0c040`,padding:16}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}><span>🔔</span><span style={{fontWeight:800,fontSize:14,color:"#b09020"}}>사후관리 미입력</span><span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:"#e8d840",color:"#7a6000",fontWeight:700}}>{pending.length}건</span></div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>{pending.map(rec=><div key={rec.id} style={{background:C.card,borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,border:`1px solid ${C.border}`}}><div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}><span style={{fontSize:12,fontWeight:700,color:C.pink1}}>{fmtDate(rec.date)}</span><span style={{fontSize:13,fontWeight:700,color:C.text}}>{rec.stock}</span>{rec.d1Change==null&&<span style={{fontSize:11,padding:"2px 6px",borderRadius:6,background:C.coral2,color:"#b06040",fontWeight:600}}>D+1</span>}{rec.d2Change==null&&<span style={{fontSize:11,padding:"2px 6px",borderRadius:6,background:C.coral2,color:"#b06040",fontWeight:600}}>D+2</span>}</div><button onClick={()=>setModal({type:"editKR",record:rec})} style={{flexShrink:0,padding:"6px 12px",borderRadius:10,border:`1.5px solid ${C.border}`,background:C.card,fontSize:12,fontWeight:700,color:C.pink1,cursor:"pointer"}}>입력하기</button></div>)}</div>
        </div>}

        {tab==="home"&&(krGroups.length===0?<div style={{textAlign:"center",padding:"64px 0"}}><div style={{fontSize:48,marginBottom:8}}>🌸</div><p style={{fontWeight:700,color:C.sub}}>기록이 없어요</p></div>:krGroups.map(([theme,recs])=>{
          const isOpen=!!openThemes[theme]; const latestDate=recs.reduce((a,b)=>a>b.date?a:b.date,""); const dPlus=daysDiff(latestDate); const avgC=(recs.reduce((s,r)=>s+(r.change||0),0)/recs.length).toFixed(2); const leader=leaders[theme];
          const stockMap={}; recs.forEach(r=>{if(!stockMap[r.stock])stockMap[r.stock]=[];stockMap[r.stock].push(r);});
          const sortedS=Object.entries(stockMap).sort(([,a],[,b])=>{const la=a.reduce((m,r)=>r.date>m?r.date:m,"");const lb=b.reduce((m,r)=>r.date>m?r.date:m,"");return lb.localeCompare(la);});
          return (
            <div key={theme} style={{background:C.card,borderRadius:18,overflow:"hidden",border:`1px solid ${C.border}`,boxShadow:`0 2px 10px ${C.pink1}20`}}>
              <button onClick={()=>setOpenThemes(p=>({...p,[theme]:!p[theme]}))} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 16px",background:C.card,border:"none",cursor:"pointer"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",minWidth:0}}>
                  <span onClick={e=>{e.stopPropagation();setEmojiTarget(theme);}} style={{fontSize:15,cursor:"pointer",borderRadius:6,padding:"2px 4px"}}>{getThemeIcon(theme,ci)}</span>
                  <span style={{fontWeight:800,fontSize:14,color:C.text}}>{theme}</span>
                  <span style={{fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:20,background:Number(avgC)>=0?C.pink2:C.blue2,color:Number(avgC)>=0?"#c0607a":"#4a7ab5"}}>{Number(avgC)>=0?"+":""}{avgC}%</span>
                  <span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:C.pink3,color:C.pink1,fontWeight:700}}>{recs.length}건</span>
                  <button onClick={e=>{e.stopPropagation();setLeaderModal({theme,stocks:[...new Set(recs.map(r=>r.stock))]});}} style={{display:"flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:20,background:leader?C.yellow2:C.pink3,border:`1px solid ${leader?"#e0c040":C.border}`,cursor:"pointer",fontSize:11,fontWeight:700,color:leader?"#b09020":C.sub}}>👑 {leader||"대장주 설정"}</button>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0,marginLeft:8}}>
                  <div style={{textAlign:"right"}}><div style={{fontSize:11,color:C.sub}}>{fmtDate(latestDate)}</div><div style={{fontSize:11,fontWeight:700,color:C.pink1}}>D+{dPlus}</div></div>
                  <span style={{fontSize:14,color:C.pink1}}>{isOpen?"▲":"▼"}</span>
                </div>

            </div>
            <div style={{padding:"0 16px 16px",display:"flex",flexDirection:"column",gap:10}}>
              <div><p style={{fontSize:11,fontWeight:700,color:"#b06040",margin:"0 0 5px"}}>📈 매수 원칙</p>{editP?<textarea value={pForm.buy} onChange={e=>setPForm(f=>({...f,buy:e.target.value}))} rows={4} style={{...iBase,background:"rgba(255,255,255,0.7)",border:`1.5px solid #e0c040`,resize:"none"}}/>:<p style={{fontSize:13,color:principle.buy?C.text:C.sub,background:"rgba(255,255,255,0.6)",borderRadius:10,padding:"10px 14px",margin:0,lineHeight:1.75,whiteSpace:"pre-wrap",minHeight:48}}>{principle.buy||"아직 원칙이 없어요 ✏️"}</p>}</div>
              <div><p style={{fontSize:11,fontWeight:700,color:"#4a7ab5",margin:"0 0 5px"}}>📉 매도 원칙</p>{editP?<textarea value={pForm.sell} onChange={e=>setPForm(f=>({...f,sell:e.target.value}))} rows={4} style={{...iBase,background:"rgba(255,255,255,0.7)",border:`1.5px solid #e0c040`,resize:"none"}}/>:<p style={{fontSize:13,color:principle.sell?C.text:C.sub,background:"rgba(255,255,255,0.6)",borderRadius:10,padding:"10px 14px",margin:0,lineHeight:1.75,whiteSpace:"pre-wrap",minHeight:48}}>{principle.sell||"아직 원칙이 없어요 ✏️"}</p>}</div>
            </div>
          </div>
          {memos.length===0&&<div style={{textAlign:"center",padding:"48px 0"}}><div style={{fontSize:40,marginBottom:8}}>📓</div><p style={{fontWeight:700,color:C.sub}}>아직 메모가 없어요</p></div>}
          {[...memos].sort((a,b)=>b.id.localeCompare(a.id)).map(memo=>(
            <div key={memo.id} style={{background:C.card,borderRadius:16,padding:16,border:`1px solid ${C.border}`}}>
              <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:8,gap:8}}>
                <div>{memo.title&&<p style={{fontWeight:800,fontSize:14,color:C.text,margin:"0 0 2px"}}>{memo.title}</p>}<p style={{fontSize:11,color:C.sub,margin:0}}>{memo.updatedAt!==memo.createdAt?`수정됨 · ${memo.updatedAt}`:memo.createdAt}</p></div>
                <div style={{display:"flex",gap:4,flexShrink:0}}><button onClick={()=>setMemoModal({memo})} style={{padding:5,background:"none",border:"none",cursor:"pointer",fontSize:14}}>✏️</button><button onClick={()=>setMemoDelModal({id:memo.id,msg:`"${memo.title||memo.content.slice(0,15)}..." 메모를 삭제합니다.`})} style={{padding:5,background:"none",border:"none",cursor:"pointer",fontSize:14}}>🗑️</button></div>
              </div>
              <p style={{fontSize:13,color:C.text,margin:0,lineHeight:1.75,whiteSpace:"pre-wrap"}}>{memo.content}</p>
            </div>
          ))}
        </>}
      </div>

      {/* 하단 탭바 */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:C.card,borderTop:`1.5px solid ${C.border}`,boxShadow:`0 -2px 16px ${C.pink1}20`,zIndex:40}}>
        <div style={{maxWidth:672,margin:"0 auto",display:"flex"}}>
          {TABS.map(({id,label,icon,ac,ab})=>(
            <button key={id} onClick={()=>setTab(id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"10px 0 7px",gap:2,background:"none",border:"none",cursor:"pointer",color:tab===id?ac:C.sub}}>
              <div style={{width:36,height:36,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",background:tab===id?ab:"transparent",fontSize:18,position:"relative"}}>
                {icon}
                {id==="fav"&&(()=>{const cnt=[...new Set(krRecords.filter(r=>favHas(favorites,r.stock)).map(r=>r.stock))].length+usCards.filter(c=>favHas(favorites,c.stock)).length;return cnt>0?<span style={{position:"absolute",top:-4,right:-4,width:16,height:16,background:C.pink1,color:"white",fontSize:10,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center"}}>{cnt}</span>:null;})()}
                {id==="memo"&&memos.length>0&&<span style={{position:"absolute",top:-4,right:-4,width:16,height:16,background:"#b06040",color:"white",fontSize:10,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center"}}>{memos.length}</span>}
              </div>
              <span style={{fontSize:10,fontWeight:tab===id?800:600}}>{label}</span>
            </button>
          ))}
        </div>
      </div>

      {(modal?.type==="addKR"||modal?.type==="editKR")&&<KRModal initial={modal.record} allRecords={krRecords} ci={ci} onSetIcon={setIcon} onSave={saveKR} onClose={()=>setModal(null)}/>}
      {(modal?.type==="addUS"||modal?.type==="editUS")&&<USModal initial={modal.card} allCards={usCards} ci={ci} onSetIcon={setIcon} onSave={saveUS} onClose={()=>setModal(null)}/>}
      {delModal&&<DeleteModal msg={delModal.msg} onConfirm={()=>delModal.type==="us"?deleteUS(delModal.id):deleteKR(delModal.id)} onCancel={()=>setDelModal(null)}/>}
      {memoModal!==null&&<MemoModal initial={memoModal.memo} onSave={saveMemo} onClose={()=>setMemoModal(null)}/>}
      {memoDelModal&&<DeleteModal msg={memoDelModal.msg} onConfirm={()=>deleteMemo(memoDelModal.id)} onCancel={()=>setMemoDelModal(null)}/>}
      {emojiTarget&&<EmojiPicker current={ci[emojiTarget]} onSelect={em=>setIcon(emojiTarget,em)} onClose={()=>setEmojiTarget(null)}/>}
      {leaderModal&&<ThemeLeaderModal theme={leaderModal.theme} current={leaders[leaderModal.theme]} stocks={leaderModal.stocks} onSave={saveLeader} onClose={()=>setLeaderModal(null)}/>}
      {buyModal&&<BuyModal stock={buyModal} onSave={info=>{saveHolding(info);setBuyModal(null);}} onClose={()=>setBuyModal(null)}/>}
      {sellModal&&<SellConfirmModal stock={sellModal.stock} holdingInfo={sellModal.holdingInfo} onConfirm={()=>{deleteHolding(sellModal.stock);setSellModal(null);}} onClose={()=>setSellModal(null)}/>}
      {ipoAddRec&&<IpoRecordModal initial={null} onSave={rec=>{setIpoRecordsWrapped(p=>[...p,rec]);setIpoAddRec(false);}} onClose={()=>setIpoAddRec(false)}/>}
      {ipoAddSched&&<IpoScheduleModal initial={null} onSave={s=>{setIpoSchedulesWrapped(p=>[...p,s]);setIpoAddSched(false);}} onClose={()=>setIpoAddSched(false)}/>}
    </div>
  );
}


// ── Firebase 앱 래퍼 ──
function AppWithAuth() {
  const [user, setUser] = React.useState(null);
  const [authLoading, setAuthLoading] = React.useState(true);
  const [loginLoading, setLoginLoading] = React.useState(false);
  const fb = window.__firebase;

  React.useEffect(()=>{
    const unsub = fb.onAuthStateChanged(fb.auth, u=>{setUser(u);setAuthLoading(false);});
    return unsub;
  },[]);

  const login = async()=>{
    setLoginLoading(true);
    try{await fb.signInWithPopup(fb.auth,fb.provider);}catch(e){console.error(e);}
    setLoginLoading(false);
  };

  if(authLoading) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#f9d4e4,#fde8d8)"}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:12,display:"inline-block"}} className="spin">🌸</div>
        <p style={{color:"#3a2535",fontWeight:700}}>불러오는 중...</p>
      </div>
    </div>
  );
  if(!user) return <LoginScreen onLogin={login} loading={loginLoading}/>;
  return <App user={user}/>;
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(AppWithAuth));
</script>
</body>
</html>
