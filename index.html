function ThemeInput({themes,setThemes,allThemes,ci,onSetIcon,usMode=false}) {
  const [inp,setInp] = useState("");
  const [sug,setSug] = useState(false);
  const [et,setEt] = useState(null);
  const [se,setSe] = useState(false);
  const filtered = allThemes.filter(t=>t.includes(inp)&&!themes.includes(t));
  const add = (t) => { if(!t.trim())return; if(!themes.includes(t))setThemes([...themes,t]); setInp(""); setSug(false); };
  const rem = (t) => { const next=themes.filter(x=>x!==t); setThemes(next); };
  const ac=usMode?C.usMid:C.pink1, bg=usMode?C.usLight:C.pink3, bd=usMode?`1.5px solid ${C.usMid}`:`1.5px solid ${C.pink1}`, is=usMode?iUS:iBase;
  return (
    <>
      {themes.length>0 && <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>{themes.map(t=><span key={t} style={{display:"flex",alignItems:"center",gap:4,padding:"4px 10px",borderRadius:20,background:bg,border:bd,fontSize:12,fontWeight:700,color:ac}}><button onMouseDown={()=>{setEt(t);setSe(true);}} style={{background:"none",border:"none",cursor:"pointer",fontSize:14,padding:0}}>{getThemeIcon(t,ci)}</button>{t}<button onMouseDown={()=>rem(t)} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,color:ac,padding:0}}>✕</button></span>)}</div>}
      <div style={{position:"relative"}}>
        <input value={inp} onChange={e=>{setInp(e.target.value);setSug(true);}} onFocus={()=>setSug(true)} onBlur={()=>setTimeout(()=>{if(inp.trim())add(inp.trim());setSug(false);},200)} onKeyDown={e=>{if(e.key==="Enter"&&inp.trim())add(inp.trim());}} placeholder="테마 입력 후 Enter" style={is}/>
        {sug&&filtered.length>0&&<div style={{position:"absolute",zIndex:10,width:"100%",borderRadius:12,boxShadow:`0 4px 16px ${C.pink1}30`,marginTop:4,border:`1.5px solid ${C.border}`,background:C.card,overflow:"hidden"}}>{filtered.map(t=><div key={t} style={{padding:"10px 14px",fontSize:13,cursor:"pointer",color:C.text}} onMouseDown={()=>add(t)}>{getThemeIcon(t,ci)} {t}</div>)}</div>}
      </div>
      {se && <EmojiPicker current={ci[et]} onSelect={em=>{if(et)onSetIcon(et,em);setEt(null);}} onClose={()=>{setSe(false);setEt(null);}}/>}
    </>
  );
}

    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      {rec.desc&&<p style={{fontSize:12,color:C.sub,margin:0}}>{hl(rec.desc)}</p>}

        {ratio&&<span style={{fontSize:11,padding:"2px 7px",borderRadius:8,background:C.yellow2,color:"#b09020",fontWeight:700}}>×{ratio}배</span>}

      {(rec.instFlow||rec.foreignFlow)&&<div style={{display:"flex",flexWrap:"wrap",gap:4}}>
        {rec.instFlow&&<span style={{fontSize:11,padding:"2px 7px",borderRadius:8,background:rec.instFlowType==="매수"?C.mint2:C.coral2,color:rec.instFlowType==="매수"?"#2a9d8f":"#b06040",fontWeight:600}}>기관 {rec.instFlowType} {rec.instFlow}만주{rec.instFlowPct?` (${rec.instFlowPct}%)`:""}</span>}

// ── 새 탭 컴포넌트들 (매매플랜, 종목체크) ──
const T = {
  up:   "#F04452",
  down: "#3182F6",
  green:"#1A9D55",
  warn: "#E5413B",
};

function computeRiskPlan({ account, riskPct, entry, stop, maxWeightPct }) {
  if (!(entry > 0)) return { error: "진입가를 입력하세요" };
  const stopDist = entry - stop;
  if (!(stopDist > 0)) return { error: "손절가는 진입가보다 낮아야 합니다" };
  const riskAmount    = account * (riskPct / 100);
  const stopPctVal    = (stopDist / entry) * 100;
  const sharesByRisk  = Math.floor(riskAmount / stopDist);
  const maxCapital    = account * (maxWeightPct / 100);
  const sharesByWeight = Math.floor(maxCapital / entry);
  const shares        = Math.max(0, Math.min(sharesByRisk, sharesByWeight));
  const cost          = shares * entry;
  const maxLoss       = shares * stopDist;
  const weightPct     = (cost / account) * 100;
  const limitedBy     = sharesByRisk <= sharesByWeight ? "risk" : "weight";
  const overLossCap   = stopPctVal > 12;
  return { riskAmount, stopDist, stopPctVal, sharesByRisk, sharesByWeight,
           shares, cost, maxLoss, weightPct, limitedBy, overLossCap };
}

function computeStats(trades) {
  const closed  = trades.filter((t) => t.exit != null);
  const pnl     = (t) => (t.exit - t.entry) * t.shares;
  const results = closed.map(pnl);
  const wins    = results.filter((r) => r > 0);
  const losses  = results.filter((r) => r < 0);
  const winRate    = closed.length ? (wins.length / closed.length) * 100 : 0;
  const avgWin     = wins.length   ? wins.reduce((a,b)=>a+b,0) / wins.length : 0;
  const avgLoss    = losses.length ? Math.abs(losses.reduce((a,b)=>a+b,0) / losses.length) : 0;
  const payoff     = avgLoss ? avgWin / avgLoss : null;
  const expectancy = closed.length ? results.reduce((a,b)=>a+b,0) / closed.length : 0;
  const totalPnl   = results.reduce((a,b)=>a+b,0);
  const followed   = closed.filter((t) => t.exit >= t.stop).length;
  const compliance = closed.length ? (followed / closed.length) * 100 : 0;
  return { n: closed.length, winRate, avgWin, avgLoss, payoff, expectancy, totalPnl, compliance };
}

// ─────────────────────────────────────────────────────────────
// 4. 종목 체크 계산 로직 (검증 완료)
// ─────────────────────────────────────────────────────────────
const sma = (v, n) => v.length >= n ? v.slice(-n).reduce((a,b)=>a+b,0)/n : null;

function rsiCalc(c, n = 14) {
  if (c.length < n + 1) return null;
  let g = 0, l = 0;
  for (let i = c.length - n; i < c.length; i++) {
    const d = c[i] - c[i-1];
    if (d > 0) g += d; else l += -d;
  }
  g /= n; l /= n;
  if (l === 0) return 100;
  return Math.round((100 - 100 / (1 + g/l)) * 10) / 10;
}

function bbWidth(c, n = 20, k = 2) {
  if (c.length < n) return null;
  const w = c.slice(-n), m = w.reduce((a,b)=>a+b,0)/n;
  const sd = Math.sqrt(w.reduce((a,b)=>a+(b-m)**2,0)/n);
  return Math.round((2*k*sd)/m*10000)/100;
}

function compressionBars(c, n = 20, th = 8, look = 40) {
  let cnt = 0;
  for (let end = c.length; end > Math.max(n, c.length-look); end--) {
    const w = bbWidth(c.slice(0,end), n);
    if (w !== null && w <= th) cnt++; else break;
  }
  return cnt;
}

function atrCalc(h, l, c, n = 14) {
  if (c.length < n + 1) return null;
  let s = 0;
  for (let i = c.length-n; i < c.length; i++)
    s += Math.max(h[i]-l[i], Math.abs(h[i]-c[i-1]), Math.abs(l[i]-c[i-1]));
  return Math.round(s/n*100)/100;
}

function analyze(ohlcv) {
  const c = ohlcv.map(b=>b.c), h = ohlcv.map(b=>b.h), l = ohlcv.map(b=>b.l);
  const price = c[c.length-1];
  const ma20 = sma(c,20), ma60 = sma(c,60);
  const r = rsiCalc(c), bw = bbWidth(c), comp = compressionBars(c), a = atrCalc(h,l,c);
  const sl      = Math.min(...l.slice(-20));
  const loLow   = Math.min(...l.slice(-60));
  const hi60    = Math.max(...c.slice(-60));
  const fromLow  = Math.round((price/loLow-1)*1000)/10;
  const fromHigh = Math.round((price/hi60-1)*1000)/10;
  const trendOk  = ma60 != null && price > ma60 && ma20 != null && ma20 > ma60;
  const overbought = r != null && r >= 70;
  const chased     = fromLow >= 30;
  const stops = {
    "60일선":    ma60 ? Math.round(ma60) : null,
    "직전저점":   Math.round(sl),
    "ATR×2":    a ? Math.round(price - 2*a) : null,
    "−8% 고정":  Math.round(price * 0.92),
  };
  const flags = [];
  if (!trendOk)   flags.push({ t: "추세 깨짐 → 패스",           lv: "bad"  });
  if (overbought) flags.push({ t: `RSI ${r} 과매수`,            lv: "warn" });
  if (chased)     flags.push({ t: `저점대비 +${fromLow}% 추격`, lv: "warn" });
  if (comp >= 9)  flags.push({ t: `응축 ${comp}봉 코일`,        lv: "ok"   });
  const pass = trendOk && !overbought && !chased;
  return { price, ma20: ma20?Math.round(ma20):null, ma60: ma60?Math.round(ma60):null,
           trendOk, rsi: r, bw, comp, fromHigh, fromLow, stops, atr: a, flags, pass };
}

const DEFAULT_SETTINGS = { account:50000000, riskPct:1.5, maxWeightPct:20 };

// ── 매매플랜 저장소: Firebase  users/{uid}/tradePlan/{key} ──
//   (window.__currentUser 는 App 에서 노출됨 — line "tradePlan 저장을 위해 현재 유저 전역 노출")
const KEY_SETTINGS = "settings";
const KEY_JOURNAL  = "journal";

async function storageGet(key, fallback) {
  try {
    const user = window.__currentUser;
    const fb   = window.__firebase;
    if (!user || !fb) return fallback;
    const snap = await fb.getDoc(fb.doc(fb.db, `users/${user.uid}/tradePlan/${key}`));
    if (snap.exists()) {
      const d = snap.data();
      return (d && "value" in d) ? d.value : fallback;
    }
  } catch (e) { console.error("storageGet error:", e); }
  return fallback;
}

async function storageSet(key, value) {
  try {
    const user = window.__currentUser;
    const fb   = window.__firebase;
    if (!user || !fb) return;
    await fb.setDoc(fb.doc(fb.db, `users/${user.uid}/tradePlan/${key}`), { value });
  } catch (e) { console.error("storageSet error:", e); }
}

function TradePlanTab({ user }) {

  React.useEffect(()=>{ if(user) window.__currentUser = user; }, [user]);
  const [view,     setView]     = useState("plan");   // plan | journal | stats

  const [settings, setSettings] = useState(DEFAULT_SETTINGS);

  const [name,    setName]    = useState("");
  const [entry,   setEntry]   = useState("");
  const [stop,    setStop]    = useState("");
  const [ma60v,   setMa60v]   = useState("");
  const [swingv,  setSwingv]  = useState("");
  const [atrv,    setAtrv]    = useState("");
  const [trendOk, setTrendOk] = useState(false);
  const [exitDraft, setExitDraft] = useState({});

  useEffect(() => {
    (async () => {
      setSettings(await storageGet(KEY_SETTINGS, DEFAULT_SETTINGS));
      setJournal(await storageGet(KEY_JOURNAL, []));
      setLoaded(true);
    })();
  }, []);
  useEffect(() => { if (loaded) storageSet(KEY_SETTINGS, settings); }, [settings, loaded]);
  useEffect(() => { if (loaded) storageSet(KEY_JOURNAL,  journal);  }, [journal,  loaded]);

  const entryN = parseFloat(entry) || 0;

  const plan   = useMemo(
    () => computeRiskPlan({ ...settings, entry:entryN, stop:stopN }),

  );
  const canLog    = !plan.error && plan.shares > 0 && trendOk;
  const filtered  = journal.filter(t => t.market === market);
  const stats     = useMemo(() => computeStats(filtered), [filtered]);
  const statsAll  = useMemo(() => computeStats(journal),  [journal]);

  const setStopByPct = (p) => { if (entryN>0) setStop(String(Math.round(entryN*(1-p/100)))); };

  const logTrade = () => {
    if (!canLog) return;
    const t = {
      id: Date.now(), market, name: name||"(이름없음)",
      entry: entryN, stop: stopN, shares: plan.shares, cost: plan.cost,
      plannedLoss: plan.maxLoss, stopPct: plan.stopPctVal, weightPct: plan.weightPct,
      date: new Date().toISOString().slice(0,10), exit:null, exitDate:null,
    };
    setJournal([t, ...journal]);
    setName(""); setEntry(""); setStop(""); setMa60v(""); setSwingv(""); setAtrv(""); setTrendOk(false);
    setView("journal");
  };

  const closeTrade = (id) => {
    const ex = parseFloat(exitDraft[id]);
    if (!(ex>0)) return;
    setJournal(journal.map(t => t.id===id ? {...t,exit:ex,exitDate:new Date().toISOString().slice(0,10)} : t));
    setExitDraft({...exitDraft,[id]:""});
  };
  const removeTrade = (id) => setJournal(journal.filter(t=>t.id!==id));

  const seg_style = (active) => ({
    flex:1, padding:"9px 0", border:"none", borderRadius:10, fontWeight:700, fontSize:14,
    background: active?C.text:C.border, color: active?"#fff":C.sub, transition:"all .15s",
  });
  const tab_style = (active) => ({
    flex:1, padding:"10px 0", border:"none", background:"transparent", fontWeight:700, fontSize:14,
    color: active?C.text:C.sub, borderBottom: active?`2px solid ${C.text}`:"2px solid transparent",
  });

  return (
    <div style={{ fontFamily:"Pretendard,'Apple SD Gothic Neo',sans-serif", background:C.bg, minHeight:"100vh", color:C.text,
                  fontVariantNumeric:"tabular-nums", paddingBottom:32 }}>

      {/* 헤더 */}
      <div style={{ padding:"24px 20px 12px" }}>
        <div style={{ fontSize:22, fontWeight:800, letterSpacing:"-0.02em" }}>
          매매 플랜<span style={{ color:T.down }}>.</span>
        </div>
        <div style={{ fontSize:12.5, color:C.sub, marginTop:4, fontWeight:500 }}>
          예측하지 않는다 · 손절과 수량을 먼저 정한다
        </div>
      </div>

      {/* 국장/미장 토글 */}
      <div style={{ display:"flex", gap:6, padding:"0 20px", marginBottom:8 }}>
        {[["KR","국장"],["US","미장"]].map(([k,label])=>(
          <button key={k} onClick={()=>setMarket(k)} style={seg_style(market===k)}>{label}</button>
        ))}
      </div>

      {/* 뷰 탭 */}
      <nav style={{ display:"flex", gap:4, padding:"4px 16px 0", borderBottom:`1px solid ${C.border}`,
                    background:C.card }}>
        {[["plan","진입 플랜"],["journal",`일지${filtered.length?` (${filtered.length})`:""}`],["stats","통계"]].map(([k,label])=>(
          <button key={k} onClick={()=>setView(k)} style={tab_style(view===k)}>{label}</button>
        ))}
      </nav>

      <div style={{ padding:"12px 16px 0" }}>

        {/* ── 진입 플랜 ── */}
        {view==="plan" && (
          <>
            <Card title="설정" sub="한 번만 정하고 가끔 수정">
              <Field label="계좌 규모 (원)">
                <Input inputMode="numeric" value={settings.account}
                  onChange={e=>setSettings({...settings,account:parseFloat(e.target.value)||0})} />
              </Field>
              <div style={{ display:"flex", gap:10 }}>
                <Field label="트레이드당 리스크 %">
                  <Input inputMode="decimal" value={settings.riskPct}
                    onChange={e=>setSettings({...settings,riskPct:parseFloat(e.target.value)||0})} />
                </Field>
                <Field label="종목당 비중 상한 %">
                  <Input inputMode="decimal" value={settings.maxWeightPct}
                    onChange={e=>setSettings({...settings,maxWeightPct:parseFloat(e.target.value)||0})} />
                </Field>
              </div>
            </Card>

            <Card title="진입 입력" sub="네가 정하는 것: 종목 · 진입가 · 손절가">
              <Field label="종목명">
                <Input value={name} placeholder="예: LIG넥스원"
                  onChange={e=>setName(e.target.value)} />
              </Field>
              <Field label="진입가 (원)">
                <Input inputMode="numeric" value={entry} placeholder="50000"
                  onChange={e=>setEntry(e.target.value)} />
              </Field>
              <Field label="손절가 (원) — 네 유일한 판단">
                <Input inputMode="numeric" value={stop} placeholder="46000"
                  onChange={e=>setStop(e.target.value)} />
              </Field>

              {/* 손절 후보 */}
              <div style={{ fontSize:12.5, color:C.sub, fontWeight:600, margin:"6px 0 8px" }}>
                손절 후보 — 골라서 적용
              </div>
              <div style={{ display:"flex", gap:8, marginBottom:12 }}>
                {[8,10,12].map(p=>(
                  <button key={p} disabled={!entryN} onClick={()=>setStopByPct(p)}
                    style={{ flex:1, padding:"9px 0", border:`1px solid ${C.border}`, borderRadius:9,
                             background:C.card, fontWeight:700, fontSize:14, color:C.text }}>
                    −{p}%
                  </button>
                ))}
              </div>
              <div style={{ fontSize:11, color:C.sub, marginBottom:8, fontWeight:500 }}>
                아래 3개는 앱 통합 시 KIS가 자동으로 채움 (지금은 수동 입력)
              </div>
              {[["60일선",ma60v,setMa60v],["직전 저점",swingv,setSwingv],["ATR 손절",atrv,setAtrv]].map(([lab,val,set])=>(
                <div key={lab} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
                  <span style={{ width:74, fontSize:13, color:C.sub, fontWeight:600 }}>{lab}</span>
                  <input inputMode="numeric" value={val} placeholder="가격"
                    onChange={e=>set(e.target.value)}
                    style={{ flex:1, padding:"10px 12px", border:`1px solid ${C.border}`, borderRadius:10,
                             fontSize:15, fontWeight:600, fontFamily:"Pretendard,'Apple SD Gothic Neo',sans-serif" }} />
                  <SmallBtn color="blue" disabled={!(parseFloat(val)>0)} onClick={()=>setStop(val)}>적용</SmallBtn>
                </div>
              ))}
            </Card>

            <Card title="리스크 플랜" sub="수량은 자동 — 손절·리스크에서 역산">
              {plan.error
                ? <div style={{ color:C.sub, fontSize:14, padding:"8px 0" }}>{plan.error}</div>
                : <>
                    {plan.overLossCap && (
                      <div style={{ background:"#FEF2F2", color:T.warn, padding:"11px 13px",
                                    borderRadius:11, fontSize:13, fontWeight:600, marginBottom:12, lineHeight:1.45 }}>
                        ⚠ 손절폭 {plan.stopPctVal.toFixed(1)}% — 손실 한도(−12%) 초과.
                        더 타이트하게 잡거나 이 진입은 건너뛰길 권해.
                      </div>
                    )}
                    <StatRow k="손절폭" v={`${won(plan.stopDist)} (${plan.stopPctVal.toFixed(1)}%)`} />
                    <StatRow k="리스크 한도" v={won(plan.riskAmount)} />
                    <StatRow k="최대 매수 수량" v={`${plan.shares.toLocaleString()}주`} big
                      note={plan.limitedBy==="weight"?"비중 상한에 의해 제한됨":"리스크 한도에 의해 결정됨"} />
                    <StatRow k="투자금" v={won(plan.cost)} />
                    <StatRow k="최대 손실 (손절 시)" v={won(plan.maxLoss)} color={T.down} />
                    <StatRow k="계좌 내 비중" v={`${plan.weightPct.toFixed(1)}%`}
                      color={plan.weightPct>settings.maxWeightPct+0.01?T.up:undefined} />
                  </>
              }
            </Card>

            <Card title="진입 체크" sub="통과해야 기록 가능">
              <label style={{ display:"flex", gap:10, alignItems:"flex-start", padding:"10px 0",
                              fontSize:14, fontWeight:500, color:C.text, lineHeight:1.4 }}>
                <input type="checkbox" checked={trendOk} onChange={e=>setTrendOk(e.target.checked)} />
                <span>추세 위에 있다 (60일선 위 / 정배열) — 역추세 매수 아님</span>
              </label>
              {[
                [!plan.error && stopN>0,  "손절선 정함",            "— 미설정"],
                [!plan.error && !plan.overLossCap, "손실 한도(−12%) 이내", "— 초과"],
              ].map(([ok,yes,no],i)=>(
                <label key={i} style={{ display:"flex", gap:10, alignItems:"flex-start", padding:"10px 0",
                                        fontSize:14, fontWeight:500, color:C.sub, lineHeight:1.4 }}>
                  <input type="checkbox" checked={ok} readOnly />
                  <span>{ok ? yes+" ✓" : yes+" "+no}</span>
                </label>
              ))}
              <div style={{ marginTop:4 }}>
                <Btn primary disabled={!canLog} onClick={logTrade}>
                  {canLog ? "이 계획대로 기록하기" : "손절 + 추세 체크가 필요해"}
                </Btn>
              </div>
            </Card>
          </>
        )}

        {/* ── 일지 ── */}
        {view==="journal" && (
          <>
            {filtered.length===0 && (
              <div style={{ textAlign:"center", color:C.sub, padding:"60px 20px",
                            fontSize:14.5, lineHeight:1.6, fontWeight:500 }}>
                아직 {market==="KR"?"국장":"미장"} 기록이 없어.<br />
                진입 플랜에서 첫 매매를 기록해봐.
              </div>
            )}
            {filtered.map(t=>{
              const open     = t.exit==null;
              const realized = open ? null : (t.exit-t.entry)*t.shares;
              const retPct   = open ? null : ((t.exit-t.entry)/t.entry)*100;
              const followed = !open && t.exit>=t.stop;
              return (
                <div key={t.id} style={{ background:C.card, borderRadius:16, padding:16,
                                         marginBottom:10, boxShadow:"0 1px 2px rgba(0,0,0,.04)" }}>
                  <div style={{ display:"flex", justifyContent:"space-between",
                                alignItems:"flex-start", marginBottom:10 }}>
                    <div>
                      <div style={{ fontSize:16, fontWeight:800 }}>{t.name}</div>
                      <div style={{ fontSize:12, color:C.sub, marginTop:3, fontWeight:500 }}>
                        {t.date} · {t.shares}주 @ {won(t.entry)}
                      </div>
                    </div>
                    {open
                      ? <span style={{ fontSize:12, fontWeight:700, color:C.sub,
                                       background:C.bg, borderRadius:8, padding:"4px 9px" }}>보유중</span>
                      : <span style={{ fontSize:14, fontWeight:800, border:`1.5px solid`,
                                       borderColor:pnlColor(realized), borderRadius:8, padding:"3px 8px",
                                       color:pnlColor(realized) }}>{pct(retPct)}</span>
                    }
                  </div>
                  <div style={{ display:"flex", gap:14, fontSize:12.5, color:C.sub,
                                fontWeight:500, marginBottom:10, flexWrap:"wrap" }}>
                    <span>손절가 {won(t.stop)} ({t.stopPct?.toFixed(1)}%)</span>
                    <span>계획손실 {won(t.plannedLoss)}</span>
                  </div>
                  {open ? (
                    <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                      <input inputMode="numeric" placeholder="매도가"
                        value={exitDraft[t.id]||""} onChange={e=>setExitDraft({...exitDraft,[t.id]:e.target.value})}
                        style={{ flex:1, padding:"10px 12px", border:`1px solid ${C.border}`, borderRadius:10,
                                 fontSize:15, fontWeight:600, fontFamily:"Pretendard,'Apple SD Gothic Neo',sans-serif" }} />
                      <SmallBtn color="blue" onClick={()=>closeTrade(t.id)}>청산</SmallBtn>
                      <SmallBtn onClick={()=>removeTrade(t.id)}>삭제</SmallBtn>
                    </div>
                  ) : (
                    <div style={{ display:"flex", gap:10, alignItems:"center", flexWrap:"wrap" }}>
                      <span style={{ color:pnlColor(realized), fontWeight:700 }}>
                        {realized>=0?"+":""}{won(realized)}
                      </span>
                      <span style={{ fontSize:11.5, fontWeight:700, borderRadius:7, padding:"4px 8px",
                                     background:followed?"#EAF6EE":"#FEF2F2",
                                     color:followed?T.green:T.warn }}>
                        {followed?"손절 준수":"손절선 이탈 (규칙 위반)"}
                      </span>
                      <SmallBtn onClick={()=>removeTrade(t.id)}>삭제</SmallBtn>
                    </div>
                  )}
                </div>
              );
            })}
          </>
        )}

        {/* ── 통계 ── */}
        {view==="stats" && (
          <>
            <Card title={`${market==="KR"?"국장":"미장"} 통계`} sub={`청산 ${stats.n}건 기준`}>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:6 }}>
                <Metric k="승률" v={stats.n ? stats.winRate.toFixed(0)+"%" : "—"} />
                <Metric k="손익비" v={stats.payoff!=null ? stats.payoff.toFixed(2) : "—"}
                  hint={stats.payoff!=null&&stats.payoff<1?"1 미만 = 손실이 더 큼":""}
                  color={stats.payoff!=null?(stats.payoff>=1?T.up:T.down):undefined} />
                <Metric k="거래당 기대값" v={stats.n?won(stats.expectancy):"—"} color={pnlColor(stats.expectancy)} />
                <Metric k="총 실현손익"   v={stats.n?won(stats.totalPnl):"—"}   color={pnlColor(stats.totalPnl)} />
                <Metric k="평균 이익" v={won(stats.avgWin)}  color={T.up} />
                <Metric k="평균 손실" v={won(-stats.avgLoss)} color={T.down} />
              </div>
              {/* 손절 준수율 */}
              <div style={{ marginTop:14, padding:14, background:"#F8F9FA", borderRadius:13 }}>
                <div style={{ fontSize:12.5, color:C.text, fontWeight:700, marginBottom:8 }}>
                  규칙 준수율 (손절선 지킨 비율)
                </div>
                <div style={{ height:8, background:C.border, borderRadius:99, overflow:"hidden" }}>
                  <div style={{ height:"100%", borderRadius:99, transition:"width .4s",
                                width:`${stats.compliance}%`,
                                background:stats.compliance>=80?T.up:T.down }} />
                </div>
                <div style={{ fontSize:20, fontWeight:800, marginTop:6 }}>
                  {stats.n ? stats.compliance.toFixed(0)+"%" : "—"}
                </div>
                <div style={{ fontSize:11.5, color:C.sub, marginTop:4, fontWeight:500, lineHeight:1.45 }}>
                  이게 진짜 KPI야. 4월(+)과 5월(−)을 가른 건 종목이 아니라 이 숫자였어.
                </div>
              </div>
            </Card>

            <Card title="전체 합산" sub="국장 + 미장">
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
                <Metric k="기대값"   v={statsAll.n?won(statsAll.expectancy):"—"} color={pnlColor(statsAll.expectancy)} />
                <Metric k="총 손익"  v={statsAll.n?won(statsAll.totalPnl):"—"}   color={pnlColor(statsAll.totalPnl)} />
                <Metric k="준수율"   v={statsAll.n?statsAll.compliance.toFixed(0)+"%":"—"} />
                <Metric k="청산 건수" v={statsAll.n+"건"} />
              </div>
            </Card>
          </>
        )}

      </div>
      <div style={{ textAlign:"center", fontSize:11, color:C.sub, padding:"8px 20px 28px", fontWeight:500 }}>
        프로토타입 · 60일선/직전저점/수급은 앱 통합 시 KIS 자동연동
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// 9. 종목 체크 탭
// ─────────────────────────────────────────────────────────────
function StockCheckTab() {
  const [q,       setQ]       = useState("");
  const [loading, setLoading] = useState(false);
  const [result,  setResult]  = useState(null);
  // result: { name, data:ohlcv[]|null, notFound:bool }

  const runAnalysis = useCallback(async (name, ohlcv) => {
    setResult({ name, data: ohlcv, notFound: !ohlcv });
  }, []);

  const search = async () => {
    const q2 = q.trim();
    if (!q2) return;
    setLoading(true);
    setResult(null);
    try {
      // 1. 실제 KIS 연결 시도
      const ohlcv = await fetchOhlcv(q2);
      if (ohlcv) { await runAnalysis(q2, ohlcv); return; }
      // 2. 데모에서 찾기
      const hit = DEMOS.find(d => d.name.includes(q2) || d.key.includes(q2));
      await runAnalysis(q2, hit ? DEMO_DATA[hit.key] : null);
    } finally { setLoading(false); }
  };

  const pickDemo = async (d) => {
    setQ(d.name); setLoading(true); setResult(null);
    try { await runAnalysis(d.name, DEMO_DATA[d.key]); }
    finally { setLoading(false); }
  };

  const r = result?.data ? analyze(result.data) : null;

  return (
    <div style={{ fontFamily:"Pretendard,'Apple SD Gothic Neo',sans-serif", background:C.bg, minHeight:"100vh", color:C.text,
                  fontVariantNumeric:"tabular-nums", paddingBottom:32 }}>

      {/* 헤더 */}
      <div style={{ padding:"24px 20px 12px" }}>
        <div style={{ fontSize:22, fontWeight:800, letterSpacing:"-0.02em" }}>
          종목 체크<span style={{ color:T.down }}>.</span>
        </div>
        <div style={{ fontSize:12.5, color:C.sub, marginTop:4, fontWeight:500 }}>
          사기 전에 — 거르고 · 경고하고 · 손절을 쥐여준다
        </div>
      </div>

      {/* 검색 */}
      <div style={{ display:"flex", gap:8, padding:"4px 16px 8px" }}>
        <input value={q} placeholder="종목명 / 종목코드"
          onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&search()}
          style={{ flex:1, padding:"13px 14px", border:`1px solid ${C.border}`, borderRadius:12,
                   fontSize:15.5, fontWeight:600, background:C.card, fontFamily:"Pretendard,'Apple SD Gothic Neo',sans-serif" }} />
        <button onClick={search} disabled={loading}
          style={{ padding:"0 18px", border:"none", borderRadius:12, background:C.text,
                   color:"#fff", fontWeight:700, fontSize:15 }}>
          {loading ? "…" : "검색"}
        </button>
      </div>

      {/* 데모 칩 */}
      <div style={{ display:"flex", gap:7, padding:"2px 16px 10px", flexWrap:"wrap" }}>
        {DEMOS.map(d=>(
          <button key={d.key} onClick={()=>pickDemo(d)}
            style={{ padding:"8px 12px", border:`1px solid ${C.border}`, borderRadius:9,
                     background:C.card, fontWeight:600, fontSize:12.5, color:C.sub }}>
            {d.name}
          </button>
        ))}
        <span style={{ fontSize:11.5, color:C.sub, alignSelf:"center", fontWeight:500 }}>
          KIS 연결 전 데모
        </span>
      </div>

      <div style={{ padding:"0 16px" }}>

        {/* 빈 상태 */}
        {!result && !loading && (
          <div style={{ textAlign:"center", color:C.sub, padding:"54px 24px",
                        fontSize:14.5, lineHeight:1.6, fontWeight:500 }}>
            종목을 검색하거나 데모를 눌러봐.<br />
            예측이 아니라 "거를지 / 손절 어디"를 알려줘.
          </div>
        )}

        {/* 데이터 없음 */}
        {result?.notFound && (
          <Card>
            <div style={{ fontSize:16, fontWeight:800, marginBottom:8 }}>{result.name}</div>
            <div style={{ color:C.sub, fontSize:14, lineHeight:1.6, fontWeight:500 }}>
              KIS가 아직 연결 안 됐어.<br />
              <b>fetchOhlcv()</b> 안의 주석을 해제하면 실제 일봉이 들어와.
            </div>
          </Card>
        )}

        {/* 분석 결과 */}
        {r && (
          <>
            {/* 판정 배너 */}
            <div style={{ background: r.pass?"#F1F8F3":"#FEF2F2",
                          border:`1.5px solid ${r.pass?T.green:T.warn}`,
                          borderRadius:16, padding:"16px 18px", marginBottom:10 }}>
              <div style={{ fontSize:13, color:C.sub, fontWeight:600 }}>{result.name}</div>
              <div style={{ fontSize:22, fontWeight:800, letterSpacing:"-0.02em",
                            color: r.pass?T.green:T.warn, marginTop:3 }}>
                {r.pass ? "기본 조건 통과" : "걸러 / 주의"}
              </div>
              <div style={{ fontSize:12.5, color:C.sub, marginTop:4, fontWeight:500 }}>
                {r.pass
                  ? "재무(실적)는 KIS로 확인 · 매수 시 손절 먼저"
                  : "아래 이유 확인 — 따라사기 / 이탈 자리"}
              </div>
            </div>

            {/* 플래그 */}
            {r.flags.length>0 && (
              <div style={{ display:"flex", flexWrap:"wrap", gap:7, marginBottom:10 }}>
                {r.flags.map((f,i)=>(
                  <span key={i} style={{ fontSize:12.5, fontWeight:700, borderRadius:8,
                                         padding:"6px 10px",
                                         background:f.lv==="ok"?"#EAF6EE":"#FEF2F2",
                                         color:f.lv==="ok"?T.green:T.warn }}>
                    {f.t}
                  </span>
                ))}
              </div>
            )}

            {/* 객관적 사실 */}
            <Card title="객관적 사실" sub="판정 아님">
              <DataRow k="현재가"        v={won(r.price)} />
              <DataRow k="추세"          v={r.trendOk?"정배열 · 살아있음":"이탈 / 꼬임"}
                color={r.trendOk?T.green:T.down} />
              <DataRow k="20일선 / 60일선" v={`${won(r.ma20)} / ${won(r.ma60)}`} />

/* ---------- 예시 데이터 + 지표 ---------- */
function scLcg(s){return ()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296;};}
function scMakeDemo(){
  const r=scLcg(73); const out=[]; let p=250000;
  for(let i=0;i<70;i++){
    let d = i<24?(r()-0.5)*6000 : i<44?4200+(r()-0.4)*8000 : i<53?6500+(r()-0.35)*9000 : -6000+(r()-0.5)*9000;
    const o=p, c=Math.max(180000,o+d);
    out.push({open:o,high:Math.max(o,c)+r()*5000,low:Math.min(o,c)-r()*5000,close:c});
    p=c;
  }
  return out;
}
function scEma(v,p){const k=2/(p+1);const o=[v[0]];for(let i=1;i<v.length;i++)o.push(v[i]*k+o[i-1]*(1-k));return o;}

/* ---------- 캔들 차트 (외부 라이브러리 없이 캔버스로) ---------- */
function SCCandleChart({candles, markers, levels}){
  const ref=useRef(null);
  useEffect(()=>{
    const cv=ref.current; if(!cv||!candles.length) return;
    const ctx=cv.getContext("2d");
    let hover=-1;
    const closes=candles.map(c=>c.close);
    const e8=scEma(closes,8), e21=scEma(closes,21), e55=scEma(closes,55);
    const padL=10,padR=92,padT=16,padB=22;
    let W,H,xStep,minP,maxP;
    function layout(){
      const dpr=window.devicePixelRatio||1; const rect=cv.getBoundingClientRect();
      W=rect.width; H=rect.height; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
      const all=candles.flatMap(d=>[d.high,d.low]).concat(e55,levels.map(l=>l.p));
      minP=Math.min(...all); maxP=Math.max(...all); const pad=(maxP-minP)*0.07; minP-=pad; maxP+=pad;
      xStep=(W-padL-padR)/candles.length;
    }
    const X=i=>padL+xStep*(i+0.5), Y=p=>padT+(H-padT-padB)*(1-(p-minP)/(maxP-minP));
    const fmt=v=>Math.round(v).toLocaleString();
    function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
    function lineS(a,c,w){ctx.beginPath();ctx.lineWidth=w;ctx.strokeStyle=c;a.forEach((v,i)=>{const x=X(i),y=Y(v);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();}
    function pill(x,y,t,c){ctx.font="600 11px "+SC_FONT;const w=ctx.measureText(t).width+12,h=17;let bx=Math.max(2,Math.min(W-padR-w,x-w/2));rr(bx,y,w,h,5);ctx.fillStyle=c;ctx.fill();ctx.fillStyle="#fff";ctx.textBaseline="middle";ctx.textAlign="center";ctx.fillText(t,bx+w/2,y+h/2+.5);}
    function draw(){
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle="#e7e9ee";ctx.fillStyle="#79808d";ctx.font="10px "+SC_FONT;ctx.textAlign="left";ctx.textBaseline="middle";
      for(let g=0;g<=4;g++){const p=minP+(maxP-minP)*g/4,y=Y(p);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();ctx.fillText(fmt(p),W-padR+6,y);}
      levels.forEach(l=>{const y=Y(l.p);ctx.setLineDash(l.dash);ctx.strokeStyle=l.color;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();ctx.setLineDash([]);ctx.font="700 10px "+SC_FONT;const w=ctx.measureText(l.label).width+10;rr(W-padR+2,y-8,w,16,4);ctx.fillStyle=l.color;ctx.fill();ctx.fillStyle="#fff";ctx.textAlign="left";ctx.fillText(l.label,W-padR+7,y+.5);});
      lineS(e55,"#d8b53f",2);lineS(e21,"#e69533",1.6);lineS(e8,"#c2c6cd",1.6);
      const bw=Math.max(2,xStep*0.62);
      candles.forEach((d,i)=>{const up=d.close>=d.open,c=up?"#1f9d73":"#e0584d",x=X(i);ctx.strokeStyle=c;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,Y(d.high));ctx.lineTo(x,Y(d.low));ctx.stroke();const yo=Y(d.open),yc=Y(d.close);ctx.fillStyle=c;ctx.fillRect(x-bw/2,Math.min(yo,yc),bw,Math.max(1.5,Math.abs(yc-yo)));});
      markers.forEach(m=>{const d=candles[m.i];if(!d)return;const x=X(m.i);const py=m.pos==="above"?Y(d.high)-26:Y(d.low)+8;ctx.fillStyle=m.c;ctx.beginPath();ctx.arc(x,m.pos==="above"?Y(d.high)-4:Y(d.low)+4,3,0,7);ctx.fill();pill(x,py,m.t,m.c);});
      if(hover>=0){const d=candles[hover],x=X(hover);ctx.setLineDash([4,4]);ctx.strokeStyle="rgba(60,60,70,.4)";ctx.beginPath();ctx.moveTo(x,padT);ctx.lineTo(x,H-padB);ctx.stroke();ctx.setLineDash([]);const t=`시 ${fmt(d.open)}  고 ${fmt(d.high)}  저 ${fmt(d.low)}  종 ${fmt(d.close)}`;ctx.font="600 11px "+SC_FONT;const tw=ctx.measureText(t).width+16;let tx=Math.min(W-padR-tw,Math.max(2,x-tw/2));rr(tx,2,tw,20,6);ctx.fillStyle="rgba(29,35,48,.93)";ctx.fill();ctx.fillStyle="#fff";ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillText(t,tx+8,12);}
    }
    function onMove(e){const rect=cv.getBoundingClientRect();const i=Math.round((e.clientX-rect.left-padL)/xStep-0.5);hover=(i>=0&&i<candles.length)?i:-1;draw();}
    function onLeave(){hover=-1;draw();}
    function resize(){layout();draw();}
    resize();
    window.addEventListener("resize",resize);
    cv.addEventListener("pointermove",onMove);
    cv.addEventListener("pointerleave",onLeave);
    return ()=>{window.removeEventListener("resize",resize);cv.removeEventListener("pointermove",onMove);cv.removeEventListener("pointerleave",onLeave);};
  },[candles,markers,levels]);
  return <canvas ref={ref} style={{width:"100%",height:"460px",display:"block"}} />;
}

/* ---------- 대시보드 ---------- */
function SCDash({dash}){
  const color=c=>c==="pos"?"#1f9d73":c==="neg"?"#e0564e":c==="warn"?"#e69533":"#1d2330";
  return (
    <div style={{background:"#fff",border:"1px solid #e7e9ee",borderRadius:12,padding:"12px 14px"}}>
      {Object.entries(dash).map(([sec,rows])=>(
        <div key={sec}>
          <div style={{fontSize:11,letterSpacing:".05em",color:"#79808d",fontWeight:800,margin:"13px 0 4px",textTransform:"uppercase"}}>{sec}</div>
          {rows.map(([k,v,cls,dot],idx)=>(
            <div key={idx} style={{display:"flex",justifyContent:"space-between",gap:10,padding:"5px 0",borderBottom:"1px solid #e7e9ee",fontSize:13}}>
              <span style={{color:"#79808d",whiteSpace:"nowrap"}}>{k}</span>
              <span style={{fontWeight:700,color:color(cls),textAlign:"right",display:"flex",alignItems:"center",gap:6,fontVariantNumeric:"tabular-nums"}}>
                {dot&&<span style={{width:9,height:9,borderRadius:"50%",background:color(cls),flex:"none"}}/>}{v}
              </span>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

  // 실시간 모드: 서버 주소가 채워져 있을 때만 동작
  useEffect(()=>{
    if(!SC_SERVER_URL||code==="DEMO") return;
    let ws;
    (async()=>{
      try{
        const res=await fetch(`${SC_SERVER_URL}/api/chart/${code}`);
        const data=await res.json();
        setCandles(data.candles.map(c=>({open:c.open,high:c.high,low:c.low,close:c.close})));
        setLive(true);
        ws=new WebSocket(`${SC_SERVER_URL.replace(/^http/,"ws")}/ws/${code}`);
        ws.onmessage=e=>{
          const t=JSON.parse(e.data);
          if(t.price) setCandles(prev=>{const n=[...prev];n[n.length-1]={...n[n.length-1],close:t.price,high:Math.max(n[n.length-1].high,t.price),low:Math.min(n[n.length-1].low,t.price)};return n;});
        };
      }catch(err){/* 서버 미준비 시 예시 데이터 유지 */}
    })();
    return ()=>ws&&ws.close();

        </div>

        <div style={{display:"flex",alignItems:"baseline",gap:10,flexWrap:"wrap",padding:"2px 2px 12px"}}>
          <span style={{fontWeight:800,fontSize:18}}>{name} <span style={{color:"#79808d",fontWeight:600,fontSize:12.5}}>· KRX · 1D</span></span>
          <span style={{fontWeight:800,fontSize:19,color:"#1f9d73",fontVariantNumeric:"tabular-nums"}}>394,500</span>
          <span style={{fontWeight:700,fontSize:13,color:"#1f9d73"}}>+69,000 (+21.20%)</span>
          <span style={{marginLeft:"auto",fontSize:11,color:"#79808d",border:"1px solid #e7e9ee",padding:"3px 9px",borderRadius:6,background:"#fff"}}>
            {live?"● 실시간":"예시 데이터 · 실거래 아님"}
          </span>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) 348px",gap:14}} className="sc-grid">
          <div style={{background:"#fff",border:"1px solid #e7e9ee",borderRadius:12,padding:6}}>
            <SCCandleChart candles={candles} markers={markers} levels={levels}/>

  );

function AIAnalysisTab({ krRecords, usCards, ipoRecords, principle, holdings, user }) {
  const [subTab, setSubTab] = React.useState("sector");
  const [loading, setLoading] = React.useState(false);
  const [result, setResult] = React.useState(null);
  const [error, setError] = React.useState(null);

  const SUB_TABS = [
    { id:"sector",label:"🔮 순환매" },
    { id:"plan",  label:"📋 매매 플랜" },
    { id:"signal",label:"📊 시그널 차트" },
  ];

  // 배포(HTTPS)에서 HTTP 오라클 호출은 브라우저가 차단(Mixed Content)
  const oracleBlocked = typeof location !== "undefined" && location.protocol === "https:";

  // buildPrompt - 기존 로직 유지
  const buildPrompt = (mode) => {
    const krSummary = krRecords.map(r => {
      const ratio = r.tradingAmt&&r.tradingAmt20 ? (r.tradingAmt/r.tradingAmt20).toFixed(1) : null;
      return `[${r.date}] ${r.stock}(${getThemes(r).join(",")}) | 상승률:${r.change}% | 거래대금배수:${ratio||"?"}x | 기관:${r.instFlow?r.instFlowType+r.instFlow+"만주":"없음"} | 외인:${r.foreignFlow?r.foreignFlowType+r.foreignFlow+"만주":"없음"} | D+1:${r.d1Change??"-"}% | D+2:${r.d2Change??"-"}% | 이유:${r.reason||""}`;
    }).join("\n");
    const holdingSummary = holdings.map(h=>`${h.stock} 매수가:${h.buy_price?.toLocaleString()}원 (${h.buy_date})`).join("\n");
    const base = `서현의 투자 스타일: 단기매매(1~3일), 대형주 위주.\n\n=== 국내주식 기록 (${krRecords.length}건) ===\n${krSummary||"없음"}\n\n=== 현재 보유 종목 ===\n${holdingSummary||"없음"}\n\n=== 매매 원칙 ===\n매수: ${principle.buy||"미작성"}\n매도: ${principle.sell||"미작성"}\n`;
    if(mode==="sell") return base+"보유 중인 종목들에 대해 지금 팔아야 하나 버텨야 하나 판단해주세요. 각 종목별로 실시간 데이터 없이 매수가와 기간만으로 판단 가능한 부분을 알려주세요. 손절가(8일선 기준)와 목표가도 제시해주세요.";
    if(mode==="sector") return base+"국내 섹터 순환매를 예측해주세요. 최근 기록된 테마들의 흐름을 보고 다음 강세 가능성이 높은 섹터를 분석해주세요.";
    return base;
  };

  const runAnalysis = async(mode) => {
    setLoading(true); setResult(null); setError(null);
    if (oracleBlocked) {
      setError("⏸ 오라클 서버 HTTPS 설정 전까지 일시 비활성화예요. 지금 페이지가 HTTPS(배포)라 HTTP 오라클(140.83.51.201) 호출이 브라우저에서 차단돼요. 로컬(http) 환경에서는 정상 동작하고, 오라클 HTTPS 적용 후 배포에서도 자동으로 켜집니다.");
      setLoading(false);
      return;
    }
    try {
      const res = await fetch("http://140.83.51.201:5000/api/analyze", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({prompt:buildPrompt(mode)}),
      });
      const data = await res.json();
      if(!res.ok){setError("오류: "+(data.error||"알 수 없는 오류"));return;}
      setResult({mode,text:data.text||"응답이 없어요."});
    } catch(e) { setError("오류: "+(e.message||"네트워크 오류")); }
    finally { setLoading(false); }
  };

  const renderText = (text) => {
    if(!text)return null;
    return text.split("\n").map((line,i)=>{
      if(line.startsWith("## "))return<div key={i} style={{fontWeight:800,fontSize:15,color:C.pink1,margin:"16px 0 6px"}}>{line.slice(3)}</div>;
      if(line.startsWith("### "))return<div key={i} style={{fontWeight:800,fontSize:14,color:C.text,margin:"12px 0 4px",borderBottom:`1px solid ${C.border}`,paddingBottom:4}}>{line.slice(4)}</div>;
      if(line.startsWith("- ")||line.startsWith("• "))return<div key={i} style={{fontSize:13,color:C.text,padding:"3px 0 3px 16px",lineHeight:1.7,position:"relative"}}><span style={{position:"absolute",left:4,color:C.pink1}}>•</span>{line.slice(2)}</div>;
      if(/^\d+\./.test(line)){const num=line.match(/^(\d+)\./)[1];return<div key={i} style={{fontSize:13,color:C.text,padding:"4px 0 4px 20px",lineHeight:1.7,position:"relative"}}><span style={{position:"absolute",left:0,fontWeight:800,color:C.pink1,fontSize:12}}>{num}.</span>{line.replace(/^\d+\.\s*/,"")}</div>;}
      if(line.trim()==="")return<div key={i} style={{height:6}}/>;
      const parts=line.split(/\*\*(.+?)\*\*/g);
      if(parts.length>1)return<div key={i} style={{fontSize:13,color:C.text,lineHeight:1.75,padding:"1px 0"}}>{parts.map((p,j)=>j%2===1?<strong key={j}>{p}</strong>:p)}</div>;
      return<div key={i} style={{fontSize:13,color:C.text,lineHeight:1.75,padding:"1px 0"}}>{line}</div>;
    });
  };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      {/* 서브탭 바 */}
      <div style={{display:"flex",gap:0,background:C.card,borderRadius:14,border:`1px solid ${C.border}`,overflow:"hidden"}}>
        {SUB_TABS.map(t=>(
          <button key={t.id} onClick={()=>{setSubTab(t.id);setResult(null);setError(null);}}
            style={{flex:1,padding:"10px 4px",border:"none",borderBottom:`2.5px solid ${subTab===t.id?"#7b2ff7":"transparent"}`,
              background:subTab===t.id?"#f8f0ff":C.card,color:subTab===t.id?"#7b2ff7":C.sub,
              fontWeight:subTab===t.id?800:600,fontSize:11,cursor:"pointer",transition:"all 0.15s"}}>
            {t.label}
          </button>
        ))}
      </div>

      {/* 🔮 순환매 */}
      {subTab==="sector"&&<>
        <div style={{background:"linear-gradient(135deg,#7b2ff7,#9b59b6)",borderRadius:18,padding:16,color:"white"}}>
          <div style={{fontSize:20,marginBottom:4}}>🔮</div>
          <div style={{fontWeight:900,fontSize:15,marginBottom:2}}>섹터 순환매 예측</div>
          <div style={{fontSize:11,opacity:.85}}>기록된 테마 흐름 기반 다음 강세 섹터 분석</div>
        </div>
        {oracleBlocked&&<div style={{background:"#fdf6cc",border:`1.5px solid #e0c040`,borderRadius:12,padding:"10px 14px",fontSize:12,color:"#7a6010",lineHeight:1.6,fontWeight:600}}>
          ⏸ 오라클 HTTPS 설정 전까지 배포(HTTPS) 환경에서는 일시 비활성화예요. 로컬(http)에서는 정상 동작해요.
        </div>}
        <button onClick={()=>runAnalysis("sector")} disabled={loading||oracleBlocked}
          style={{padding:"14px",borderRadius:14,border:"none",background:oracleBlocked?"#e0e0e0":"linear-gradient(135deg,#7b2ff7,#9b59b6)",color:"white",fontWeight:700,fontSize:14,cursor:(loading||oracleBlocked)?"not-allowed":"pointer"}}>
          {loading?"분석 중...":oracleBlocked?"오라클 HTTPS 준비 중 (일시 비활성화)":"🔍 순환매 분석 시작"}
        </button>
        {error&&<div style={{background:C.red2,borderRadius:12,padding:14,fontSize:13,color:"#c0392b",fontWeight:700,lineHeight:1.6}}>⚠️ {error}</div>}
        {result&&result.mode==="sector"&&!loading&&<div style={{background:C.card,borderRadius:18,border:`1.5px solid #c8b8f8`,overflow:"hidden"}}>
          <div style={{padding:"12px 16px",background:"#f0e8ff",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontWeight:800,fontSize:13,color:"#7b2ff7"}}>🔮 순환매 예측 결과</span>
            <button onClick={()=>setResult(null)} style={{background:"none",border:"none",cursor:"pointer",fontSize:14,color:C.sub}}>✕</button>
          </div>
          <div style={{padding:"14px 16px 18px",maxHeight:500,overflowY:"auto"}}>{renderText(result.text)}</div>
        </div>}
      </>}

      {/* 📋 매매 플랜 */}
      {subTab==="plan"&&<TradePlanTab user={user}/>}

      {/* 📊 시그널 차트 */}
      {subTab==="signal"&&<SignalChartTab/>}

      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );
}


// ── 공모주 탭 ──
function IPOTab({records,setRecords,schedules,setSchedules,onAddRec,onAddSched}) {
  const [sub,setSub] = useState("calendar");
  const [detailRec,setDetailRec] = useState(null);
  const [detailSched,setDetailSched] = useState(null);
  const [sellDay,setSellDay] = useState(null);
  const [delTarget,setDelTarget] = useState(null);
  const [editRecModal,setEditRecModal] = useState(null);
  const [editSchedModal,setEditSchedModal] = useState(null);
  const [calMonth,setCalMonth] = useState(()=>{const t=new Date();return{y:t.getFullYear(),m:t.getMonth()};});
  const [openStat,setOpenStat] = useState(null);
  const [filterBroker,setFilterBroker] = useState("전체");
  const td = todayStr();

  const sold = records.filter(r=>r.sellPrice&&r.sellDate);
  const holding = records.filter(r=>!r.sellPrice||!r.sellDate).sort((a,b)=>(!a.listingDate?1:!b.listingDate?-1:a.listingDate.localeCompare(b.listingDate)));
  const fHolding = filterBroker==="전체" ? holding : holding.filter(r=>r.broker===filterBroker);
  const fSold = filterBroker==="전체" ? sold : sold.filter(r=>r.broker===filterBroker);
  const totalP = useMemo(()=>sold.reduce((a,r)=>a+(Number(r.sellPrice)-Number(r.ipoPrice))*Number(r.allocatedQty),0),[sold]);
  const pColor = (p) => p>=0?"#059669":"#dc2626";
  const fmtP = (p) => (p>=0?"+":"")+Number(p).toLocaleString("ko-KR")+"원";

  const yearlyS = useMemo(()=>{const m={};sold.forEach(r=>{const k=r.sellDate.slice(0,4);const p=(Number(r.sellPrice)-Number(r.ipoPrice))*Number(r.allocatedQty);if(!m[k])m[k]={profit:0,count:0,items:[]};m[k].profit+=p;m[k].count++;m[k].items.push(r);});return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0]));},[sold]);
  const monthlyS = useMemo(()=>{const m={};sold.forEach(r=>{const k=r.sellDate.slice(0,7);const p=(Number(r.sellPrice)-Number(r.ipoPrice))*Number(r.allocatedQty);if(!m[k])m[k]={profit:0,count:0,items:[]};m[k].profit+=p;m[k].count++;m[k].items.push(r);});return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0]));},[sold]);
  const brokerS = useMemo(()=>{const m={};sold.forEach(r=>{const p=(Number(r.sellPrice)-Number(r.ipoPrice))*Number(r.allocatedQty);if(!m[r.broker])m[r.broker]={count:0,profit:0,items:[]};m[r.broker].count++;m[r.broker].profit+=p;m[r.broker].items.push(r);});return Object.entries(m).sort((a,b)=>b[1].profit-a[1].profit);},[sold]);

  const calData = useMemo(()=>{
    const{y,m}=calMonth; const fd=new Date(y,m,1).getDay(); const dim=new Date(y,m+1,0).getDate();
    const cells=[]; for(let i=0;i<fd;i++)cells.push(null);
    for(let d=1;d<=dim;d++){
      const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const li=records.filter(r=>r.listingDate===ds);
      const si=records.filter(r=>r.sellDate===ds&&r.sellPrice);
      const dp=si.reduce((a,r)=>a+(Number(r.sellPrice)-Number(r.ipoPrice))*Number(r.allocatedQty),0);
      const ss=schedules.filter(s=>dateInRange(ds,s.subStart,s.subEnd));
      const ls=schedules.filter(s=>s.listingDate===ds);
      cells.push({d,dateStr:ds,listingItems:li,sellItems:si,dayProfit:dp,subScheds:ss,listingScheds:ls});
    }
    return cells;
  },[calMonth,records,schedules]);

  const ipoDateFmt = (d) => { if(!d)return"-"; const dt=new Date(d+"T00:00:00"); return`${d} (${DAYS_KO[dt.getDay()]})`; };
  const ipoDiff = (d) => { if(!d)return null; const t=new Date(); t.setHours(0,0,0,0); const dt=new Date(d+"T00:00:00"); dt.setHours(0,0,0,0); return Math.ceil((dt-t)/(1000*60*60*24)); };
  const subBtn = (id,label) => <button onClick={()=>setSub(id)} style={{padding:"5px 11px",borderRadius:20,border:"none",fontWeight:700,fontSize:12,cursor:"pointer",background:sub===id?`linear-gradient(135deg,${C.pink1},${C.coral1})`:"#f0e8f0",color:sub===id?"#fff":"#b08898"}}>{label}</button>;
  const saveRec = (rec, goHolding=false) => { const {_fromScheduleId,...clean}=rec; setRecords(p=>p.some(r=>r.id===clean.id)?p.map(r=>r.id===clean.id?clean:r):[...p,clean]); setEditRecModal(null); if(goHolding) setSub("holding"); };
  const saveSched = (s) => { setSchedules(p=>p.some(x=>x.id===s.id)?p.map(x=>x.id===s.id?s:x):[...p,s]); setEditSchedModal(null); };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
        {[{label:"💰 누적 수익",value:fmtP(totalP),color:pColor(totalP),bg:totalP>=0?"#f0fdf9":C.red2},{label:"🌷 보유 종목",value:holding.length+"종목",color:C.pink1,bg:C.pink3},{label:"✅ 완료 종목",value:sold.length+"종목",color:"#c0607a",bg:C.pink2}].map(c=>(
          <div key={c.label} style={{background:c.bg,borderRadius:14,padding:"10px 8px",border:`1.5px solid ${C.border}`,textAlign:"center"}}>
            <div style={{fontSize:10,color:C.sub,marginBottom:3,fontWeight:600}}>{c.label}</div>
            <div style={{fontSize:13,fontWeight:800,color:c.color}}>{c.value}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:5,flexWrap:"wrap",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{subBtn("calendar","📅 달력")}{subBtn("schedule","📌 청약")}{subBtn("holding","🌷 보유")}{subBtn("sold","✅ 매도")}{subBtn("stats","📊 통계")}</div>
        {(sub==="holding"||sub==="sold")&&<select value={filterBroker} onChange={e=>setFilterBroker(e.target.value)} style={{fontSize:11,padding:"4px 8px",borderRadius:8,border:`1.5px solid ${C.border}`,color:C.sub,background:"#fff"}}><option>전체</option>{BROKERS.map(b=><option key={b}>{b}</option>)}</select>}
      </div>

      {sub==="calendar"&&<div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,background:C.card,borderRadius:14,padding:"10px 14px",border:`1.5px solid ${C.border}`}}>
          <button onClick={()=>setCalMonth(p=>{const d=new Date(p.y,p.m-1);return{y:d.getFullYear(),m:d.getMonth()};})} style={{background:C.pink2,border:"none",borderRadius:8,width:28,height:28,fontSize:14,cursor:"pointer",color:"#db2777"}}>‹</button>
          <span style={{fontWeight:800,fontSize:14,color:C.text}}>🌸 {calMonth.y}년 {calMonth.m+1}월</span>
          <button onClick={()=>setCalMonth(p=>{const d=new Date(p.y,p.m+1);return{y:d.getFullYear(),m:d.getMonth()};})} style={{background:C.pink2,border:"none",borderRadius:8,width:28,height:28,fontSize:14,cursor:"pointer",color:"#db2777"}}>›</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:4}}>{["일","월","화","수","목","금","토"].map((d,i)=><div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,padding:"3px 0",color:i===0?"#f472b6":i===6?"#a78bfa":C.sub}}>{d}</div>)}</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:3}}>
          {calData.map((cell,i)=>{
            if(!cell)return <div key={"e"+i}/>;
            const isToday=cell.dateStr===td; const dow=new Date(cell.dateStr+"T00:00:00").getDay();
            const hasAny=cell.listingItems.length>0||cell.sellItems.length>0||cell.subScheds.length>0||cell.listingScheds.length>0;

                <div style={{fontSize:11,fontWeight:isToday?800:500,color:isToday?C.pink1:dow===0?"#f472b6":dow===6?"#a78bfa":C.text,textAlign:"center",marginBottom:2}}>{cell.d}</div>
                {cell.subScheds.map(s=><div key={s.id} onClick={()=>setDetailSched(s)} style={{fontSize:8,fontWeight:700,padding:"1px 2px",borderRadius:3,marginBottom:2,background:C.blue2,color:"#4a7ab5",textAlign:"center",cursor:"pointer",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>📋{s.name}</div>)}
                {cell.listingScheds.map(s=><div key={s.id} onClick={()=>setDetailSched(s)} style={{fontSize:8,fontWeight:700,padding:"1px 2px",borderRadius:3,marginBottom:2,background:C.mint2,color:"#059669",textAlign:"center",cursor:"pointer",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>🟢{s.name}</div>)}
                {cell.listingItems.map(r=><div key={r.id} onClick={()=>setDetailRec(r)} style={{fontSize:8,fontWeight:700,padding:"1px 2px",borderRadius:3,marginBottom:2,background:r.sellPrice?C.mint2:C.pink2,color:r.sellPrice?"#059669":C.pink1,textAlign:"center",cursor:"pointer",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>🌸{r.name}</div>)}
                {cell.sellItems.length>0&&<div onClick={()=>{if(cell.sellItems.length===1)setDetailRec(cell.sellItems[0]);else setSellDay(cell);}} style={{fontSize:8,fontWeight:800,textAlign:"center",marginTop:2,cursor:"pointer",background:cell.dayProfit>=0?C.mint2:C.red2,borderRadius:3,padding:"1px 2px",color:pColor(cell.dayProfit)}}>{cell.dayProfit>=0?"+":""}{Number(cell.dayProfit).toLocaleString("ko-KR")}원</div>}
              </div>

        </div>

          return (
            <div key={s.id} style={{background:C.card,borderRadius:14,padding:"12px 14px",border:`1.5px solid ${C.border}`,borderLeft:`4px solid ${isActive?C.pink1:isDone?C.sub:C.coral1}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>

                  <span style={{fontWeight:800,fontSize:14,color:C.text}}>📌 {s.name}</span>

                <IBox label="📅 청약 시작" value={ipoDateFmt(s.subStart)}/><IBox label="📅 청약 마감" value={ipoDateFmt(s.subEnd)}/><IBox label="💸 환불일" value={ipoDateFmt(s.refundDate)}/><IBox label="🚀 상장일" value={ipoDateFmt(s.listingDate)}/>

              {isDone&&<button onClick={()=>setEditRecModal({id:`i${Date.now()}`,name:s.name,broker:s.broker,subscribeQty:s.subscribeQty||"",allocatedQty:"",ipoPrice:"",listingDate:s.listingDate||"",sellPrice:"",sellDate:"",memo:s.memo||"",_fromScheduleId:s.id})} style={{marginTop:8,width:"100%",background:`linear-gradient(135deg,${C.pink1},${C.coral1})`,color:"#fff",border:"none",borderRadius:8,padding:"8px",fontWeight:700,fontSize:12,cursor:"pointer"}}>🌷 배정 결과 입력하기 →</button>}
            </div>
          );
        })}
      </div>}

      {sub==="holding"&&<div style={{display:"flex",flexDirection:"column",gap:8}}>
        {fHolding.length===0&&<div style={{textAlign:"center",color:C.sub,padding:32}}>보유 중인 종목이 없어요 🌸</div>}
        {fHolding.map(r=>{
          const dd=ipoDiff(r.listingDate); const listed=dd!==null&&dd<=0;
          return (
            <div key={r.id} style={{background:C.card,borderRadius:14,padding:"12px 14px",border:`1.5px solid ${C.border}`,cursor:"pointer"}} onClick={()=>setDetailRec(r)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  <span style={{fontWeight:800,fontSize:14,color:C.text}}>🌷 {r.name}</span>
                  <span style={{fontSize:11,padding:"2px 7px",borderRadius:20,background:C.pink3,color:C.pink1,fontWeight:700}}>{r.broker}</span>
                  {listed?<span style={{fontSize:11,padding:"2px 7px",borderRadius:20,background:C.mint2,color:"#059669",fontWeight:700}}>🎉 상장완료</span>:dd===0?<span style={{fontSize:11,padding:"2px 7px",borderRadius:20,background:C.pink2,color:"#c0607a",fontWeight:700}}>🚀 오늘!</span>:dd>0?<span style={{fontSize:11,padding:"2px 7px",borderRadius:20,background:C.blue2,color:"#4a7ab5",fontWeight:700}}>D-{dd}</span>:null}

                <div style={{display:"flex",gap:5}} onClick={e=>e.stopPropagation()}>
                  <button onClick={()=>setEditRecModal(r)} style={{fontSize:11,padding:"3px 8px",borderRadius:7,border:`1px solid ${C.border}`,cursor:"pointer",background:C.pink3,color:C.sub}}>✏️</button>

                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6,marginTop:10}}>
                <IBox label="청약 수량" value={r.subscribeQty?Number(r.subscribeQty).toLocaleString()+"주":"-"}/><IBox label="배정 수량" value={Number(r.allocatedQty).toLocaleString()+"주"}/><IBox label="공모가" value={Number(r.ipoPrice).toLocaleString()+"원"}/><IBox label="🚀 상장일" value={ipoDateFmt(r.listingDate)}/>
              </div>
              {r.memo&&<div style={{marginTop:6,fontSize:11,color:C.sub}}>💬 {r.memo}</div>}
              {listed&&<button onClick={e=>{e.stopPropagation();setEditRecModal(r);}} style={{marginTop:8,width:"100%",background:`linear-gradient(135deg,${C.pink1},${C.coral1})`,color:"#fff",border:"none",borderRadius:8,padding:"8px",fontWeight:700,fontSize:12,cursor:"pointer"}}>💰 매도가 입력하기</button>}
            </div>
          );
        })}
      </div>}

      {sub==="sold"&&<div style={{display:"flex",flexDirection:"column",gap:8}}>

        {fSold.map(r=>{
          const profit=(Number(r.sellPrice)-Number(r.ipoPrice))*Number(r.allocatedQty);
          const rate=((Number(r.sellPrice)-Number(r.ipoPrice))/Number(r.ipoPrice)*100).toFixed(1);
